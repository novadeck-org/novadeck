name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/e2e.yml
      - application/protocol/**
      - application/relay/**
      - application/runner/**
      - harnesses/**
      - scripts/e2e/**
      - package.json
      - pnpm-lock.yaml
  schedule:
    # Nightly, against each harness's latest release, to catch drift before a pin moves.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      harness:
        description: Harness versions to run against
        type: choice
        options: [pinned, latest]
        default: pinned

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # The Linux jobs keep their names; the Windows and macOS ones say so.
    name: ${{ matrix.setup.name }}${{ matrix.os == 'windows-latest' && ' (Windows)' || matrix.os == 'macos-latest' && ' (macOS)' || '' }}
    runs-on: ${{ matrix.os }}
    # Windows starts processes and consoles several times slower, and has no namespace;
    # macOS's runners are slower than Linux's too.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || matrix.os == 'macos-latest' && 30 || 20 }}
    defaults:
      run:
        # Git's bash on Windows, so every step reads alike on all three.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        setup:
          - agents: claude
            name: Claude Code
          - agents: codex
            name: Codex
          - agents: agy
            name: Antigravity
          # Every harness at once, for the scenarios across harnesses alone (`*.mixed.e2e.ts`),
          # which the jobs above skip; theirs it leaves to them.
          - agents: claude,codex,agy
            name: Mixed
            files: mixed.e2e.ts
    env:
      NOVADECK_E2E_CACHE: ${{ github.workspace }}/.e2e-cache
      # Where a failed test writes what the runner heard and did (src/e2e/trace.ts).
      NOVADECK_E2E_TRACES: ${{ github.workspace }}/e2e-traces
      NOVADECK_E2E_AGENTS: ${{ matrix.setup.agents }}
      NOVADECK_E2E_HARNESS: ${{ (github.event_name == 'schedule' || inputs.harness == 'latest') && 'latest' || 'pinned' }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      # Each harness's own pin, hashed alone, so moving one harness's pin keeps the others'
      # caches.
      - name: Hash Pins
        id: pins
        if: env.NOVADECK_E2E_HARNESS == 'pinned'
        run: |
          # Hashed inside node, so a failure fails the step rather than hashing nothing.
          node -e 'const { createHash } = require("node:crypto"); const pins = require("./application/runner/src/e2e/harnesses.json"); for (const harness of ["claude", "codex", "agy"]) console.log(harness + "=" + createHash("sha256").update(JSON.stringify(pins[harness] ?? null)).digest("hex"))' >> "$GITHUB_OUTPUT"

      # Pinned harnesses are cached each on its own, by its pin and the installer, so the job
      # of one harness and the mixed job share them; a run against latest installs fresh.
      # Only the harness's own folders go in, never npm's cache (home) or unfinished staging.
      - name: Restore Claude Code
        id: claude
        if: env.NOVADECK_E2E_HARNESS == 'pinned' && contains(format(',{0},', matrix.setup.agents), ',claude,')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.NOVADECK_E2E_CACHE }}/claude-*
            !${{ env.NOVADECK_E2E_CACHE }}/*.tmp
          key: e2e-harnesses-${{ runner.os }}-claude-${{ steps.pins.outputs.claude }}-${{ hashFiles('application/runner/src/e2e/install.ts') }}

      - name: Restore Codex
        id: codex
        if: env.NOVADECK_E2E_HARNESS == 'pinned' && contains(format(',{0},', matrix.setup.agents), ',codex,')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.NOVADECK_E2E_CACHE }}/codex-*
            !${{ env.NOVADECK_E2E_CACHE }}/*.tmp
          key: e2e-harnesses-${{ runner.os }}-codex-${{ steps.pins.outputs.codex }}-${{ hashFiles('application/runner/src/e2e/install.ts') }}

      - name: Restore Antigravity
        id: agy
        if: env.NOVADECK_E2E_HARNESS == 'pinned' && contains(format(',{0},', matrix.setup.agents), ',agy,')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.NOVADECK_E2E_CACHE }}/agy-*
            !${{ env.NOVADECK_E2E_CACHE }}/*.tmp
          key: e2e-harnesses-${{ runner.os }}-agy-${{ steps.pins.outputs.agy }}-${{ hashFiles('application/runner/src/e2e/install.ts') }}

      # With the network, as the relay's build may install the Rust it names.
      - name: Build Protocol and Relay
        run: pnpm --filter @novadeck/protocol --filter @novadeck/relay build

      # Installed here, with the network; the tests then run without any.
      - name: Install Harnesses
        run: node scripts/e2e/install/main.ts

      # GitHub's macOS image turns on Reduce motion, which Codex follows: it then draws no
      # logo on its first screen, a state the suite rings it in. Back to a Mac's default.
      - name: Allow Motion
        if: runner.os == 'macOS'
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          [ "$(defaults read com.apple.universalaccess reduceMotion)" = 0 ]

      # The whole suite, with the tests of every harness left out skipped (the mixed job
      # runs its own files alone). On Linux in a network namespace whose only interface is
      # loopback: no route out, proxy or not. Windows and macOS have no such namespace:
      # there the fake model's proxy, which refuses every tunnel, and the suite's own
      # checks for strays and foreign credentials keep the harnesses off the network.
      - name: Run E2E
        env:
          FILES: ${{ matrix.setup.files }}
        run: |
          if [ "$RUNNER_OS" != Linux ]; then
            pnpm --filter @novadeck/runner test:e2e ${FILES:+"$FILES"}
          else
            node scripts/e2e/isolated/main.ts -- pnpm --filter @novadeck/runner test:e2e ${FILES:+"$FILES"}
          fi

      # A failed test leaves its trace: each hook's report and when its hook started, the
      # person's keys, each delivery change and each answer, with the model's calls. A
      # cancelled run keeps the traces its failed tests wrote before it was cut short.
      - name: Upload E2E Traces
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-${{ matrix.setup.name }}-${{ runner.os }}
          path: ${{ env.NOVADECK_E2E_TRACES }}
          if-no-files-found: ignore
          retention-days: 7

      # The namespace wrapper's own tests against a real namespace, which only a runner
      # that allows one can run; once, in one job.
      - name: Test Network Namespace
        if: matrix.setup.agents == 'claude' && runner.os == 'Linux'
        env:
          NOVADECK_E2E_NETNS_TESTS: "1"
        run: npx vitest run --config vitest.config.ts scripts/e2e

      # Which of the job's harnesses finished installing: a folder for it, not a staging
      # one, that holds its program (`agy.exe` on Windows). A cancelled or failed install
      # leaves none, and saves nothing.
      - name: Check Harnesses
        id: installed
        if: ${{ !cancelled() && env.NOVADECK_E2E_HARNESS == 'pinned' }}
        run: |
          for harness in ${NOVADECK_E2E_AGENTS//,/ }; do
            bin=$(jq -r --arg harness "$harness" '.[$harness].bin' application/runner/src/e2e/harnesses.json)
            found=false
            for folder in "$NOVADECK_E2E_CACHE/$harness"-*; do
              case "$folder" in *.tmp) continue ;; esac
              if [ -x "$folder/node_modules/.bin/$bin" ] || [ -x "$folder/bin/$bin" ] || [ -x "$folder/bin/$bin.exe" ]; then found=true; fi
            done
            echo "$harness=$found" >> "$GITHUB_OUTPUT"
          done

      # Each saved, should it have missed, even when the tests fail, so the next run needn't
      # install it again.
      - name: Save Claude Code
        if: ${{ !cancelled() && steps.claude.outcome == 'success' && steps.claude.outputs.cache-hit != 'true' && steps.installed.outputs.claude == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.NOVADECK_E2E_CACHE }}/claude-*
            !${{ env.NOVADECK_E2E_CACHE }}/*.tmp
          key: ${{ steps.claude.outputs.cache-primary-key }}

      - name: Save Codex
        if: ${{ !cancelled() && steps.codex.outcome == 'success' && steps.codex.outputs.cache-hit != 'true' && steps.installed.outputs.codex == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.NOVADECK_E2E_CACHE }}/codex-*
            !${{ env.NOVADECK_E2E_CACHE }}/*.tmp
          key: ${{ steps.codex.outputs.cache-primary-key }}

      - name: Save Antigravity
        if: ${{ !cancelled() && steps.agy.outcome == 'success' && steps.agy.outputs.cache-hit != 'true' && steps.installed.outputs.agy == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.NOVADECK_E2E_CACHE }}/agy-*
            !${{ env.NOVADECK_E2E_CACHE }}/*.tmp
          key: ${{ steps.agy.outputs.cache-primary-key }}

  # What a green Windows job above can't catch, as people's machines differ from the
  # runner's: a PowerShell profile that prints (Claude Code's hooks run in PowerShell, and
  # Codex's, which it starts with -NoProfile, so its job shows that holds), a home and Novadeck's launcher in a folder named with a space (cmd reads
  # Antigravity's launcher by its short name), a folder the registry's PATH gained after
  # the app started (a new terminal's PATH is read from the registry), and a cmd AutoRun
  # that prints (Antigravity's PreToolUse guard and plugin refresh). Each changes this
  # runner's own machine, which no test may do on a developer's. The core scenarios run
  # for each harness; the AutoRun last, as it turns Antigravity's messaging off by design.
  quirks:
    name: ${{ matrix.setup.name }} (Windows quirks)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        setup:
          - agents: claude
            name: Claude Code
            # The registry's PATH needs no harness: it runs in one job.
            files: messaging.e2e.ts requests.e2e.ts lifecycle.e2e.ts windows-quirks.e2e.ts
          - agents: codex
            name: Codex
            files: messaging.e2e.ts requests.e2e.ts lifecycle.e2e.ts
          - agents: agy
            name: Antigravity
            files: messaging.e2e.ts requests.e2e.ts lifecycle.e2e.ts
            autorun: true
    env:
      NOVADECK_E2E_CACHE: ${{ github.workspace }}/.e2e-cache
      NOVADECK_E2E_TRACES: ${{ github.workspace }}/e2e-traces
      NOVADECK_E2E_AGENTS: ${{ matrix.setup.agents }}
      NOVADECK_E2E_HARNESS: ${{ (github.event_name == 'schedule' || inputs.harness == 'latest') && 'latest' || 'pinned' }}
      # The sandbox, its home and Novadeck's launcher inside it, named with a space.
      NOVADECK_E2E_SPACED: "1"
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Hash Pins
        id: pins
        if: env.NOVADECK_E2E_HARNESS == 'pinned'
        run: |
          node -e 'const { createHash } = require("node:crypto"); const pins = require("./application/runner/src/e2e/harnesses.json"); for (const harness of ["claude", "codex", "agy"]) console.log(harness + "=" + createHash("sha256").update(JSON.stringify(pins[harness] ?? null)).digest("hex"))' >> "$GITHUB_OUTPUT"

      # The e2e jobs' caches, restored only: those jobs save them.
      - name: Restore Harness
        if: env.NOVADECK_E2E_HARNESS == 'pinned'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.NOVADECK_E2E_CACHE }}/${{ matrix.setup.agents }}-*
            !${{ env.NOVADECK_E2E_CACHE }}/*.tmp
          key: e2e-harnesses-${{ runner.os }}-${{ matrix.setup.agents }}-${{ steps.pins.outputs[matrix.setup.agents] }}-${{ hashFiles('application/runner/src/e2e/install.ts') }}

      - name: Build Protocol and Relay
        run: pnpm --filter @novadeck/protocol --filter @novadeck/relay build

      - name: Install Harnesses
        run: node scripts/e2e/install/main.ts

      # A profile for every user and host that prints, as many people's do; a folder the
      # user's PATH in the registry gains now, after this job's runner started, so no later
      # step has it on its own PATH; and whether this volume keeps the short names cmd reads
      # a launcher with a space by.
      - name: Set Up Quirks
        shell: pwsh
        run: |
          Set-Content -LiteralPath (Join-Path $PSHOME 'profile.ps1') -Value 'Write-Output "novadeck-ci: a profile printed this"'
          # The profile prints in a new PowerShell, or this quirk would test nothing.
          $printed = pwsh -NoLogo -Command 'exit 0'
          if (-not ($printed -match 'a profile printed this')) { throw "A new PowerShell printed no profile line: $printed" }
          $folder = Join-Path $env:RUNNER_TEMP 'novadeck registry folder'
          New-Item -ItemType Directory -Force $folder | Out-Null
          Set-Content -LiteralPath (Join-Path $folder 'novadeck-registry-marker.cmd') -Value '@echo registry marker ran'
          $user = [Environment]::GetEnvironmentVariable('Path', 'User')
          [Environment]::SetEnvironmentVariable('Path', "$user;$folder", 'User')
          "NOVADECK_E2E_REGISTRY_FOLDER=$folder" >> $env:GITHUB_ENV
          fsutil 8dot3name query $env:SystemDrive | Out-Host
          exit 0

      - name: Run E2E
        env:
          FILES: ${{ matrix.setup.files }}
        run: |
          # Each file a word of its own.
          # shellcheck disable=SC2086
          pnpm --filter @novadeck/runner test:e2e $FILES

      # Last: cmd prints before every command from here on.
      - name: Test cmd AutoRun
        if: ${{ !cancelled() && matrix.setup.autorun }}
        shell: pwsh
        env:
          NOVADECK_TEST_CMD_AUTORUN: "1"
        run: |
          $key = 'HKCU:\Software\Microsoft\Command Processor'
          if (-not (Test-Path $key)) { New-Item -Path $key | Out-Null }
          Set-ItemProperty -Path $key -Name AutoRun -Value 'echo novadeck-ci: an AutoRun printed this'
          pnpm --filter @novadeck/runner exec vitest run src/harnesses/service.test.ts

      - name: Upload E2E Traces
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-${{ matrix.setup.name }}-Windows-quirks
          path: ${{ env.NOVADECK_E2E_TRACES }}
          if-no-files-found: ignore
          retention-days: 7
