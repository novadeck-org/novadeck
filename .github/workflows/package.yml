name: Package

# The app packaged and smoke-tested on Linux, macOS and Windows. Release calls it for main,
# with the version and the commit; Quality calls it for a pull request once its checks pass,
# so no runner waits on them. A called workflow runs in its caller's context: for a pull
# request, its event, its read-only token and no secrets, so it signs nothing. A draft marked
# ready starts it here, as Quality ran already. For a pull request, its Scope job skips the
# packaging when the change can't affect the packaged app.
on:
  workflow_call:
    inputs:
      version:
        description: The version to package as; a pull request's is 0.0.0.
        type: string
        default: ""
      source_sha:
        description: The commit to package, when not a pull request's head.
        type: string
        default: ""
  pull_request:
    types: [ready_for_review]

permissions:
  actions: read
  contents: read

# A draft marked ready again replaces its own earlier run. A called run is its caller's to
# cancel, so it takes a group of its own.
concurrency:
  group: package-${{ github.event.action == 'ready_for_review' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event.action == 'ready_for_review' }}

jobs:
  # Whether a pull request's change can affect the packaged app (scripts/package/plan): yes
  # unless it changes tests, docs or what the app isn't built from alone. Skipped for main,
  # whose release depends on nothing but its packaging.
  scope:
    name: Scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package: ${{ steps.plan.outputs.package }}
    steps:
      # The whole history: git diffs the pull request's base against its head.
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set Up Toolchain
        id: toolchain
        continue-on-error: true
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      # An immediate retry hit the same registry outage in the flake audit.
      - name: Wait Before Retrying Toolchain
        if: steps.toolchain.outcome == 'failure'
        shell: bash
        run: sleep 180

      - name: Set Up Toolchain Again
        if: steps.toolchain.outcome == 'failure'
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Plan Packaging
        id: plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/package/plan/main.ts

  package:
    # A skipped Scope (main's) packages, and so does a failed one, as one that couldn't read
    # the change does.
    if: "!cancelled() && needs.scope.outputs.package != 'false'"
    needs: scope
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      # The packages run to be smoke tested, which must not look for updates.
      NOVADECK_UPDATES: "off"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, not ubuntu-latest: the voice and murmur engines link against the image's
          # glibc, and may need any version up to its own. Ubuntu 26.04's 2.43 left them
          # unable to start on 24.04 and most other desktops (0.0.163 to 0.0.171).
          - name: Linux
            os: ubuntu-24.04
            target: linux
            expected: novadeck-linux-x86_64.AppImage latest-linux.yml
            files: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/latest-linux.yml
              apps/desktop/release/novadeck-whisper-linux-x64.tar.gz
              apps/desktop/release/novadeck-murmur-linux-x64.tar.gz
          - name: macOS
            os: macos-latest
            target: mac
            expected: novadeck-mac-universal.dmg novadeck-mac-universal.zip latest-mac.yml
            files: |
              apps/desktop/release/*.zip
              apps/desktop/release/*.dmg
              apps/desktop/release/latest-mac.yml
              apps/desktop/release/*.blockmap
              apps/desktop/release/novadeck-whisper-darwin-universal.tar.gz
              apps/desktop/release/novadeck-murmur-darwin-universal.tar.gz
          - name: Windows
            os: windows-latest
            target: win
            expected: novadeck-win-x64-setup.exe novadeck-win-x64.zip latest.yml
            files: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.zip
              apps/desktop/release/latest.yml
              apps/desktop/release/*.blockmap
              apps/desktop/release/novadeck-whisper-win32-x64.tar.gz
              apps/desktop/release/novadeck-murmur-win32-x64.tar.gz
    steps:
      # Only a draft marked ready gets here before its Quality checks are known; Quality
      # calls this workflow itself once they pass. It waits for Quality's Test check of the
      # pull request's head, not for the whole run, which may be packaging too.
      - name: Wait for Quality Checks
        if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          for attempt in {1..10}; do
            run="$(gh api "repos/${REPOSITORY}/actions/workflows/quality.yml/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.head_sha == env.HEAD_SHA) |
                select(any(.pull_requests[]; .number == (env.PR_NUMBER | tonumber) and .base.sha == env.BASE_SHA))] |
                max_by(.run_number) // empty | .id')"

            if [[ -n "$run" ]]; then
              test="$(gh api --paginate "repos/${REPOSITORY}/actions/runs/${run}/jobs" \
                --jq '.jobs[] | select(.name == "Test") | {status, conclusion}' | tail -n 1)"
              [[ -n "$test" ]] || test='{}'
              status="$(jq -r '.status // "queued"' <<<"$test")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$test")"
              echo "Quality's Test check for ${HEAD_SHA}: ${status}${conclusion:+ (${conclusion})}"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" == "success" ]]; then
                  exit 0
                fi
                echo "::error::Quality's Test check completed with ${conclusion}."
                exit 1
              fi
            else
              echo "No matching Quality run found yet for PR #${PR_NUMBER} at ${HEAD_SHA}."
            fi

            if [[ "$attempt" -lt 10 ]]; then
              sleep 180
            fi
          done

          echo "::error::Quality checks did not complete within the wait window."
          exit 1

      - name: Check Out Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.source_sha }}

      - name: Set Up Toolchain
        id: toolchain
        continue-on-error: true
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      # An immediate retry hit the same registry outage in the flake audit.
      - name: Wait Before Retrying Toolchain
        if: steps.toolchain.outcome == 'failure'
        shell: bash
        run: sleep 180

      - name: Set Up Toolchain Again
        if: steps.toolchain.outcome == 'failure'
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Set Package Version
        run: npm --prefix apps/desktop pkg set "version=${{ inputs.version || '0.0.0' }}"

      # Releases from main are signed once the signing credentials are in the repository's
      # secrets and variables; pull requests, and releases before then, are left unsigned.
      # The voice and murmur engines are signed with the app, so their builds and caches
      # follow the same choice. Only what later steps need goes to GITHUB_ENV: the Azure secrets go to the
      # two steps that sign, and the macOS key and keychain are removed after packaging.
      # See docs/release-signing.md.
      - name: Set Up Signing
        id: signing
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ matrix.target }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: |
          set -euo pipefail
          signed=false
          engine=unsigned

          # Succeeds when every named value is set and fails the release when only some
          # are, rather than shipping that platform unsigned.
          configured() {
            local what="$1" present=0 missing=""
            shift
            for name in "$@"; do
              if [[ -n "${!name:-}" ]]; then present=$((present + 1)); else missing="$missing $name"; fi
            done
            if [[ "$present" -gt 0 && -n "$missing" ]]; then
              echo "::error::$what is only partly set up; it also needs:$missing"
              exit 1
            fi
            [[ "$present" -gt 0 ]]
          }

          # GITHUB_ENV takes a line per variable, so a value with a line break is refused.
          export_env() {
            if [[ "$2" == *$'\n'* ]]; then
              echo "::error::$1 holds a line break."
              exit 1
            fi
            echo "$1=$2" >> "$GITHUB_ENV"
          }

          if [[ "$EVENT_NAME" != pull_request && "$TARGET" == mac ]] &&
            configured "macOS signing" MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; then
            # A keychain of its own, first in the search list, where electron-builder and the
            # voice and murmur engines' builds find the Developer ID identity. Only codesign
            # may use the key, and the key cannot be exported from it.
            keychain="$RUNNER_TEMP/signing.keychain-db"
            password="$(openssl rand -hex 24)"
            certificate="$RUNNER_TEMP/certificate.p12"
            echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$certificate"
            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -x -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain"
            rm "$certificate"
            security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
            # The runner's keychain paths hold no spaces; they stay searched after this one.
            # shellcheck disable=SC2046
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

            identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / { print $2; exit }')"
            if [[ -z "$identity" ]]; then
              echo "::error::MACOS_CERTIFICATE holds no Developer ID Application identity."
              exit 1
            fi

            # @electron/notarize reads the App Store Connect key from a file.
            key="$RUNNER_TEMP/notarization/AuthKey_${APPLE_API_KEY_ID}.p8"
            mkdir -p "$(dirname "$key")"
            printf '%s\n' "$APPLE_API_KEY" > "$key"
            export_env NOVADECK_MAC_IDENTITY "$identity"
            export_env NOVADECK_SIGNING_KEYCHAIN "$keychain"
            export_env APPLE_API_KEY "$key"
            export_env APPLE_API_KEY_ID "$APPLE_API_KEY_ID"
            export_env APPLE_API_ISSUER "$APPLE_API_ISSUER"
            signed=true
            engine="developer-id-$identity"
          fi

          # Keyed on the signing variables alone: AZURE_TENANT_ID and AZURE_CLIENT_ID are
          # common names that a repository may hold for something else.
          if [[ "$EVENT_NAME" != pull_request && "$TARGET" == win ]] &&
            configured "Windows signing" AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE AZURE_SIGNING_PUBLISHER; then
            missing=""
            for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
              if [[ -z "${!name:-}" ]]; then missing="$missing $name"; fi
            done
            if [[ -n "$missing" ]]; then
              echo "::error::Windows signing is only partly set up; it also needs:$missing"
              exit 1
            fi
            export_env AZURE_SIGNING_ENDPOINT "$AZURE_SIGNING_ENDPOINT"
            export_env AZURE_SIGNING_ACCOUNT "$AZURE_SIGNING_ACCOUNT"
            export_env AZURE_SIGNING_PROFILE "$AZURE_SIGNING_PROFILE"
            export_env AZURE_SIGNING_PUBLISHER "$AZURE_SIGNING_PUBLISHER"
            signed=true
            engine="azure-$AZURE_SIGNING_ACCOUNT-$AZURE_SIGNING_PROFILE"
          fi

          {
            echo "signed=$signed"
            # Names the identity, so a rotated certificate builds the engine afresh.
            echo "engine=$engine"
          } >> "$GITHUB_OUTPUT"
          echo "Signing: $signed"

      # Voice input's engine, whisper.cpp built for this platform (see engines/whisper),
      # and murmur's, llama.cpp (see engines/murmur), are compiled here, not by the
      # Quality workflow's builds: each takes minutes, and its archive is a release asset the
      # app downloads, while the app ships only its manifest. The engines' Vulkan backend, and
      # fusermount3 for the AppImage's static runtime, which the smoke test mounts; apt skips
      # it when the image has it.
      - name: Install Build Dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev glslc spirv-headers fuse3

      - name: Install Vulkan SDK (Windows)
        if: matrix.target == 'win'
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: 1.4.363.0
          install_runtime: false
          cache: true

      # Keyed on the runner's label too, so an engine built on ubuntu-latest is not reused.
      - name: Restore Voice Engine
        id: engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/whisper/dist
          key: whisper-engine-${{ matrix.os }}-${{ runner.arch }}-${{ steps.signing.outputs.engine }}-${{ hashFiles('engines/ggml-build/index.ts', 'engines/ggml-build/package.json', 'engines/whisper/scripts/**', 'engines/whisper/patches/**', 'engines/whisper/package.json') }}

      - name: Build Voice Engine
        if: steps.engine.outputs.cache-hit != 'true'
        env:
          AZURE_TENANT_ID: ${{ matrix.target == 'win' && steps.signing.outputs.signed == 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.target == 'win' && steps.signing.outputs.signed == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.target == 'win' && steps.signing.outputs.signed == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: pnpm --filter @novadeck/whisper build:engine

      - name: Restore Murmur Engine
        id: murmur
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/murmur/dist
          key: murmur-engine-${{ matrix.os }}-${{ runner.arch }}-${{ steps.signing.outputs.engine }}-${{ hashFiles('engines/ggml-build/index.ts', 'engines/ggml-build/package.json', 'engines/murmur/scripts/**', 'engines/murmur/patches/**', 'engines/murmur/package.json') }}

      - name: Build Murmur Engine
        if: steps.murmur.outputs.cache-hit != 'true'
        env:
          AZURE_TENANT_ID: ${{ matrix.target == 'win' && steps.signing.outputs.signed == 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.target == 'win' && steps.signing.outputs.signed == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.target == 'win' && steps.signing.outputs.signed == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: pnpm --filter @novadeck/murmur build:engine

      # Neither engine may need a glibc newer than Ubuntu 24.04's, or it fails to load on the
      # desktops that have that or older, though it runs on the image that built it.
      - name: Check Engines' glibc (Linux)
        if: matrix.target == 'linux'
        run: |
          floor=2.39
          engines="$RUNNER_TEMP/engines-glibc"
          mkdir -p "$engines/whisper" "$engines/murmur"
          tar -xzf engines/whisper/dist/novadeck-whisper-*.tar.gz -C "$engines/whisper"
          tar -xzf engines/murmur/dist/novadeck-murmur-*.tar.gz -C "$engines/murmur"
          failed=0
          while IFS= read -r -d '' file; do
            [[ "$(head -c 4 "$file")" == $'\x7fELF' ]] || continue
            needs="$({ objdump -T "$file" 2>/dev/null || true; } | { grep -o 'GLIBC_[0-9.]*' || true; } | sed 's/GLIBC_//' | sort -uV | tail -n 1)"
            echo "${needs:-none} ${file#"$engines"/}"
            if [[ -n "$needs" && "$(printf '%s\n' "$floor" "$needs" | sort -V | tail -n 1)" != "$floor" ]]; then
              echo "::error::${file#"$engines"/} needs glibc $needs, newer than $floor."
              failed=1
            fi
          done < <(find "$engines" -type f -print0)
          exit "$failed"

      # The engines run on people's desktops, not on the image that built them, which has more
      # libraries than a desktop may. So on Linux they are checked in a clean Ubuntu 24.04 with
      # only the Vulkan loader added, as a desktop has it: here every file must find each library
      # it links (ldd also says when one needs a newer glibc; what an engine loads later, such as
      # a GPU driver, is not ldd's to see), and the checks below start the servers there.
      - name: Check Engines' Libraries (Linux)
        if: matrix.target == 'linux'
        run: |
          # Ubuntu's mirrors and Docker Hub fail now and then: a few tries, and what the last
          # one said when none worked.
          for try in 1 2 3; do
            if printf '%s\n' 'FROM ubuntu:24.04' \
              'RUN apt-get update && apt-get install -y --no-install-recommends libvulkan1 && rm -rf /var/lib/apt/lists/*' |
              docker build --tag novadeck-engine-check - > "$RUNNER_TEMP/engine-check-image.txt" 2>&1; then
              break
            fi
            if (( try == 3 )); then
              tail -n 30 "$RUNNER_TEMP/engine-check-image.txt"
              echo "::error::The clean Ubuntu image for the engine checks could not be built."
              exit 1
            fi
            sleep 20
          done
          engines="$RUNNER_TEMP/engines-glibc"
          # Every ELF file, as the glibc check finds them; none found is a failure, not a pass.
          docker run --rm --network none -v "$engines:$engines:ro" novadeck-engine-check bash -c '
            status=0
            count=0
            while IFS= read -r -d "" file; do
              [[ "$(head -c 4 "$file" | tr -d "\0")" == $'"'"'\x7fELF'"'"' ]] || continue
              count=$((count + 1))
              # A static file is not dynamic, and needs nothing.
              printed="$(ldd "$file" 2>&1)" || [[ "$printed" == *"not a dynamic executable"* ]] || printed+=" (ldd failed)"
              if grep -E "not found|ldd failed" <<< "$printed"; then
                echo "::error::${file#"$0"/} needs a library, or a version of one, that a clean Ubuntu 24.04 lacks."
                status=1
              fi
            done < <(find "$0" -type f -print0)
            echo "Checked $count files."
            if (( count == 0 )); then
              echo "::error::No engine files were found to check."
              status=1
            fi
            exit "$status"' "$engines"

      # Unpacks the engine with the tar the runner uses on this platform and runs it, so a
      # missing library or backend module fails here rather than on a person's machine.
      - name: Check Voice Engine
        shell: bash
        run: |
          engine="$RUNNER_TEMP/voice-engine"
          mkdir -p "$engine"
          archive="$(ls engines/whisper/dist/novadeck-whisper-*.tar.gz)"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "$SYSTEMROOT/System32/tar.exe" -xzf "$(cygpath -w "$archive")" -C "$(cygpath -w "$engine")"
            server="$engine/whisper-server.exe"
          else
            tar -xzf "$archive" -C "$engine"
            server="$engine/whisper-server"
          fi
          # On Linux the server runs in the clean image (see Check Engines' Libraries).
          run=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            run=(docker run --rm -i --network none -v "$engine:$engine:ro" novadeck-engine-check)
          fi
          "${run[@]}" "$server" --help > /dev/null
          # The flags the runner starts the server with (backend/runner/src/voice/engine.ts):
          # with a model that is not there, the server must complain of the model and exit with
          # a failure within moments, even though its stdin stays open, as the runner holds it.
          # The sleep holds stdin open; a server that is still there when it ends has not exited
          # on its own, and exits 0 as its stdin closes. (A server that does not know a flag
          # prints its usage and exits 0.) Its own time is taken by the subshell around it, as
          # the pipeline waits for the sleep. The build checks that the patch applies.
          flags=(--host 127.0.0.1 --port 0 --request-path /check -l en -nt -t 2 --vad --exit-with-stdin)
          model="$engine/absent.bin"
          if [[ "$RUNNER_OS" == "Windows" ]]; then model="$(cygpath -m "$engine")/absent.bin"; fi
          start=$(date +%s)
          sleep 15 | { code=0; "${run[@]}" "$server" "${flags[@]}" -m "$model" -vm "$model" > "$RUNNER_TEMP/voice-flags.txt" 2>&1 || code=$?; echo "$code $(date +%s)" > "$RUNNER_TEMP/voice-end.txt"; }
          read -r status ended < "$RUNNER_TEMP/voice-end.txt"
          tr -d '\r' < "$RUNNER_TEMP/voice-flags.txt" | tail -n 20
          if [[ "$status" == 0 ]]; then
            if grep -q -i -E 'unknown argument|usage:' "$RUNNER_TEMP/voice-flags.txt"; then
              echo "::error::The server does not take the flags the runner starts it with (it printed its usage)."
            else
              echo "::error::The server did not fail on a missing model while its stdin was open."
            fi
            exit 1
          fi
          if (( ended - start > 10 )); then
            echo "::error::The server took $((ended - start)) s to fail on a missing model."
            exit 1
          fi
          if ! grep -q -i -E 'absent\.bin|failed to initialize whisper context' "$RUNNER_TEMP/voice-flags.txt"; then
            echo "::error::The server did not complain of the missing model."
            exit 1
          fi

      # The same for murmur's server, which must also list its devices with their types:
      # the runner picks the GPU from that list. A runner has no GPU, so the list may be empty.
      - name: Check Murmur Engine
        shell: bash
        run: |
          engine="$RUNNER_TEMP/murmur-engine"
          mkdir -p "$engine"
          archive="$(ls engines/murmur/dist/novadeck-murmur-*.tar.gz)"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "$SYSTEMROOT/System32/tar.exe" -xzf "$(cygpath -w "$archive")" -C "$(cygpath -w "$engine")"
            server="$engine/llama-server.exe"
          else
            tar -xzf "$archive" -C "$engine"
            server="$engine/llama-server"
          fi
          # On Linux the server runs in the clean image (see Check Engines' Libraries).
          run=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            run=(docker run --rm -i --network none -v "$engine:$engine:ro" novadeck-engine-check)
          fi
          "${run[@]}" "$server" --help > /dev/null
          "${run[@]}" "$server" --list-devices | tr -d '\r' | tee "$RUNNER_TEMP/murmur-devices.txt"
          grep -q '^Available devices:' "$RUNNER_TEMP/murmur-devices.txt"
          # A runner without a GPU prints "  (none)", which is not a device.
          if grep -E '^  [^ (]' "$RUNNER_TEMP/murmur-devices.txt" | grep -v -E ' \[(cpu|gpu|igpu|accel)\]$'; then
            echo "::error::A device line has no type."
            exit 1
          fi
          # The flags the runner starts the server with (backend/runner/src/murmur/service.ts):
          # with a model that is not there, the server must get as far as complaining of the
          # model, not of an argument it does not know or cannot read, and exit with a failure
          # at once even though its stdin stays open, as the runner holds it. The sleep holds
          # stdin open; a server that is still there when it ends has not exited on its own,
          # and exits 0 as its stdin closes. Its own time is taken by the subshell around it,
          # as the pipeline waits for the sleep.
          flags=(--host 127.0.0.1 --port 0 --device none -ngl 999 -c 4096 -np 1 --reasoning off --exit-with-stdin)
          model="$engine/absent.gguf"
          if [[ "$RUNNER_OS" == "Windows" ]]; then model="$(cygpath -m "$engine")/absent.gguf"; fi
          start=$(date +%s)
          sleep 15 | { code=0; "${run[@]}" "$server" "${flags[@]}" -m "$model" > "$RUNNER_TEMP/murmur-flags.txt" 2>&1 || code=$?; echo "$code $(date +%s)" > "$RUNNER_TEMP/murmur-end.txt"; }
          read -r status ended < "$RUNNER_TEMP/murmur-end.txt"
          tr -d '\r' < "$RUNNER_TEMP/murmur-flags.txt" | tail -n 20
          if [[ "$status" == 0 ]]; then
            echo "::error::The server did not fail on a missing model while its stdin was open."
            exit 1
          fi
          if (( ended - start > 10 )); then
            echo "::error::The server took $((ended - start)) s to fail on a missing model."
            exit 1
          fi
          if grep -q -i -E 'invalid argument|unknown argument|unrecognized|unrecognised|error while handling argument|invalid value|usage:' "$RUNNER_TEMP/murmur-flags.txt"; then
            echo "::error::The server does not take the flags the runner starts it with."
            exit 1
          fi
          if ! grep -q -i -E 'absent\.gguf|failed to load model|error loading model|failed to open' "$RUNNER_TEMP/murmur-flags.txt"; then
            echo "::error::The server did not complain of the missing model."
            exit 1
          fi
          # With stdin closed the patched server ends at once and cleanly; an unpatched one
          # rejects the flag.
          status=0
          "${run[@]}" "$server" "${flags[@]}" -m "$model" < /dev/null > "$RUNNER_TEMP/murmur-stdin.txt" 2>&1 || status=$?
          if [[ "$status" != 0 ]]; then
            cat "$RUNNER_TEMP/murmur-stdin.txt"
            echo "::error::The server did not end cleanly when its stdin closed."
            exit 1
          fi

      # The engines carry the C runtime inside them (engines/ggml-build): one that imports it
      # needs the Visual C++ redistributable, which a computer may lack or have older than the
      # build's. The checks above ran on a runner that has it, so they could not tell.
      - name: Check Engines' C Runtime (Windows)
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) {
            Write-Output "::error::dumpbin was not found."
            exit 1
          }
          $failed = $false
          foreach ($folder in "$env:RUNNER_TEMP\voice-engine", "$env:RUNNER_TEMP\murmur-engine") {
            $count = 0
            foreach ($file in Get-ChildItem $folder -Recurse -Include *.dll, *.exe) {
              $count++
              $imports = & $dumpbin /nologo /dependents $file.FullName
              if ($LASTEXITCODE -ne 0) {
                Write-Output "::error::dumpbin could not read $($file.Name)."
                $failed = $true
                continue
              }
              $runtime = $imports | Select-String -Pattern '^\s+((vcruntime|msvcp|concrt|vcomp)\S*\.dll)'
              if ($runtime) {
                $names = ($runtime | ForEach-Object { $_.Matches[0].Groups[1].Value }) -join ", "
                Write-Output "::error::$($file.Name) needs the Visual C++ redistributable ($names)."
                $failed = $true
              }
            }
            Write-Output "Checked $count files in $folder."
            if ($count -eq 0) {
              Write-Output "::error::No engine files were found in $folder."
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      # The relay is built with the Rust its rust-toolchain.toml names; on macOS as one
      # binary for both architectures. macOS signs with the keychain's identity on its own;
      # Windows signs when given the Azure account, which goes to electron-builder through
      # `pnpm exec`, as cmd.exe would mangle the quoted publisher in `pnpm run`. The app's
      # update feed is this repository's releases, whatever the repository is named.
      - name: Package Application
        shell: bash
        env:
          NOVADECK_RELAY_UNIVERSAL: "1"
          REPOSITORY: ${{ github.repository }}
          AZURE_TENANT_ID: ${{ matrix.target == 'win' && steps.signing.outputs.signed == 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.target == 'win' && steps.signing.outputs.signed == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.target == 'win' && steps.signing.outputs.signed == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: |
          feed=("-c.publish.owner=${REPOSITORY%%/*}" "-c.publish.repo=${REPOSITORY#*/}")
          if [[ "${{ matrix.target }}" != win || -z "${AZURE_SIGNING_PROFILE:-}" ]]; then
            pnpm run package:${{ matrix.target }} "${feed[@]}"
            exit 0
          fi
          pnpm --workspace-root exec turbo run build --filter=@novadeck/desktop
          pnpm --dir apps/desktop exec electron-builder --win --x64 --publish never "${feed[@]}" \
            "-c.win.azureSignOptions.publisherName=$AZURE_SIGNING_PUBLISHER" \
            "-c.win.azureSignOptions.endpoint=$AZURE_SIGNING_ENDPOINT" \
            "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGNING_ACCOUNT" \
            "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGNING_PROFILE"

      # The installers, install.sh and the app's update feed all fetch these names, so a
      # rename in the builder's configuration fails here rather than on a person's computer.
      - name: Check Package Names
        shell: bash
        env:
          EXPECTED: ${{ matrix.expected }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for name in $EXPECTED; do
            if [[ ! -f "apps/desktop/release/$name" ]]; then
              echo "::error::The build produced no $name."
              exit 1
            fi
          done
          update="$(find apps/desktop/release -name app-update.yml -print -quit)"
          if [[ -z "$update" ]] || ! grep -qx "owner: ${REPOSITORY%%/*}" "$update" || ! grep -qx "repo: ${REPOSITORY#*/}" "$update"; then
            echo "::error::The packaged app's update feed does not name $REPOSITORY."
            exit 1
          fi

      # electron-updater finds the AppImage to replace in latest-linux.yml.
      - name: Check Linux Update Metadata
        if: matrix.target == 'linux'
        run: |
          if ! grep -q 'url: novadeck-linux-x86_64.AppImage$' apps/desktop/release/latest-linux.yml; then
            echo "::error::latest-linux.yml does not list novadeck-linux-x86_64.AppImage."
            exit 1
          fi

      # The rest of the job runs the packaged app and the engine, which need no key.
      - name: Remove Signing Credentials (macOS)
        if: always() && matrix.target == 'mac' && steps.signing.outputs.signed == 'true'
        run: |
          rm -f "$APPLE_API_KEY"
          security delete-keychain "$NOVADECK_SIGNING_KEYCHAIN" || true

      # Fails the release, rather than shipping a package Gatekeeper or SmartScreen would
      # treat as unsigned, when signing was set up but did not take.
      - name: Verify Signatures (macOS)
        if: matrix.target == 'mac' && steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          verify="$RUNNER_TEMP/novadeck-verify"
          mkdir -p "$verify/engine"
          ditto -x -k "$(find apps/desktop/release -maxdepth 1 -name '*.zip' -print -quit)" "$verify"
          bundle="$(find "$verify" -maxdepth 1 -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          spctl --assess --type execute --verbose=2 "$bundle"
          xcrun stapler validate "$bundle"

          # The disk image holds its own copy of the bundle, which people drag out of it.
          image="$RUNNER_TEMP/novadeck-verify-image"
          hdiutil attach -nobrowse -readonly -mountpoint "$image" "$(find apps/desktop/release -maxdepth 1 -name '*.dmg' -print -quit)" > /dev/null
          bundle="$(find "$image" -maxdepth 1 -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          spctl --assess --type execute --verbose=2 "$bundle"
          xcrun stapler validate "$bundle"
          # The system's assessment can still hold the image a moment after spctl answers
          # ("hdiutil: couldn't eject … Resource busy", Release run 39127891782), so the
          # detach is tried again, waiting a little longer each time.
          for attempt in 1 2 3 4 5; do
            hdiutil detach -force "$image" > /dev/null && break
            if (( attempt == 5 )); then exit 1; fi
            sleep $((attempt * 3))
          done

          mkdir -p "$verify/murmur"
          tar -xzf engines/whisper/dist/novadeck-whisper-*.tar.gz -C "$verify/engine"
          tar -xzf engines/murmur/dist/novadeck-murmur-*.tar.gz -C "$verify/murmur"
          for file in "$verify"/engine/whisper-server "$verify"/murmur/llama-server "$verify"/engine/*.dylib "$verify"/murmur/*.dylib; do
            if [[ -f "$file" && ! -L "$file" ]]; then
              codesign --verify --strict --verbose=2 "$file"
              codesign --display --verbose=2 "$file" 2>&1 | grep '^Authority=Developer ID Application: ' > /dev/null
            fi
          done

      - name: Verify Signatures (Windows)
        if: matrix.target == 'win' && steps.signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          $engine = Join-Path $env:RUNNER_TEMP "novadeck-verify-engine"
          New-Item -ItemType Directory -Force -Path $engine | Out-Null
          $murmur = Join-Path $env:RUNNER_TEMP "novadeck-verify-murmur"
          New-Item -ItemType Directory -Force -Path $murmur | Out-Null
          $archive = Get-ChildItem engines/whisper/dist -Filter "novadeck-whisper-*.tar.gz" | Select-Object -First 1
          & "$env:SystemRoot\System32\tar.exe" -xzf $archive.FullName -C $engine
          $archive = Get-ChildItem engines/murmur/dist -Filter "novadeck-murmur-*.tar.gz" | Select-Object -First 1
          & "$env:SystemRoot\System32\tar.exe" -xzf $archive.FullName -C $murmur
          # The ZIP is made from win-unpacked, but its own contents are what people run.
          $portable = Join-Path $env:RUNNER_TEMP "novadeck-verify-portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf apps/desktop/release/novadeck-win-x64.zip -C $portable
          if ($LASTEXITCODE -ne 0) {
            throw "The portable ZIP did not extract."
          }
          $files = @(Get-ChildItem apps/desktop/release -Filter *.exe) +
            @(Get-ChildItem apps/desktop/release/win-unpacked -Recurse -Include *.exe, *.dll, *.node) +
            @(Get-ChildItem $portable -Recurse -Include *.exe, *.dll, *.node) +
            @(Get-ChildItem $engine -Include *.exe, *.dll -Recurse) +
            @(Get-ChildItem $murmur -Include *.exe, *.dll -Recurse)
          $unsigned = $files | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne "Valid" }
          if ($unsigned) {
            $unsigned | ForEach-Object { Write-Host "::error::Not validly signed: $($_.FullName)" }
            throw "$(@($unsigned).Count) files are not validly signed."
          }
          Write-Host "$($files.Count) files are validly signed."

      # Each package runs for ten seconds as people get it: the AppImage as it is and as
      # install.sh installs it from a local copy of the release, then the app from the macOS
      # ZIP, disk image and install.sh, and from the Windows installer and ZIP. The AppImage mounts
      # itself through FUSE 3, with no extraction flag.
      - name: Smoke Test Linux Packages
        if: matrix.target == 'linux'
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          release=apps/desktop/release
          # The app stops a moment after timeout stops xvfb-run. A launch started before it is
          # gone would hand off to it through the single-instance lock, which Chromium keeps
          # as a link to host-pid in the data folder, and exit at once.
          lock="${XDG_CONFIG_HOME:-$HOME/.config}/novadeck/SingletonLock"
          settle() {
            local what="$1" target pid
            for _ in {1..30}; do
              target="$(readlink "$lock" 2> /dev/null || true)"
              pid="${target##*-}"
              if [[ -z "$target" || ! "$pid" =~ ^[0-9]+$ ]] || ! kill -0 "$pid" 2> /dev/null; then
                return
              fi
              sleep 0.5
            done
            echo "::error::The $what was still running 15 seconds after it was stopped."
            exit 1
          }
          launch() {
            local what="$1" status
            shift
            set +e
            timeout --kill-after=5s 10s xvfb-run -a "$@"
            status=$?
            set -e
            if [[ "$status" -ne 124 ]]; then
              echo "::error::The $what exited before the smoke-test interval (status $status)."
              exit 1
            fi
            settle "$what"
          }

          artifact="$(realpath "$(find "$release" -maxdepth 1 -name '*.AppImage' -print -quit)")"
          chmod +x "$artifact"
          unset APPDIR APPIMAGE
          launch AppImage "$artifact"

          # install.sh runs as released, against a local copy of the release's packages and
          # their checksums, so the real install path is what gets tested.
          serve="$RUNNER_TEMP/novadeck-release"
          mkdir -p "$serve"
          cp "$release"/novadeck-linux-x86_64.AppImage "$serve"
          (cd "$serve" && sha256sum -- * > SHA256SUMS)
          sed "s|@REPOSITORY@|$REPOSITORY|g" scripts/install/install.sh > "$RUNNER_TEMP/install.sh"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$serve" > /dev/null 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for _ in {1..30}; do
            if curl -fs -o /dev/null http://127.0.0.1:8765/SHA256SUMS; then break; fi
            sleep 1
          done
          curl -fs -o /dev/null http://127.0.0.1:8765/SHA256SUMS

          export NOVADECK_INSTALL_BASE_URL=http://127.0.0.1:8765
          sh "$RUNNER_TEMP/install.sh"
          launch "AppImage installed by install.sh" "$HOME/.local/bin/novadeck"
          if [[ ! -f "$HOME/.local/share/applications/dev.mzpk.novadeck.desktop" || ! -f "$HOME/.local/share/icons/hicolor/512x512/apps/novadeck.png" ]]; then
            echo "::error::install.sh left no menu entry or icon for the AppImage."
            exit 1
          fi

      # Chromium's sandbox needs unprivileged user namespaces, which Ubuntu 24.04 refuses to
      # programs without an AppArmor profile (kernel.apparmor_restrict_unprivileged_userns is
      # 1 on this runner, and the step fails if that changes). install.sh writes a profile for the installed AppImage; without it
      # AppRun starts the app with --no-sandbox. So the installed app must run with its
      # renderers in a user namespace of their own, which is how the sandbox shows itself,
      # and without --no-sandbox on the browser process.
      - name: Check Linux Sandbox
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2> /dev/null || echo 0)" != 1 ]]; then
            echo "::error::This runner no longer restricts unprivileged user namespaces (kernel.apparmor_restrict_unprivileged_userns is not 1), so install.sh writes no profile and this check proves nothing. Update the step for the new runner image."
            exit 1
          fi
          profile="/etc/apparmor.d/novadeck-appimage-$(id -u)"
          if [[ ! -f "$profile" ]]; then
            echo "::error::install.sh wrote no AppArmor profile at $profile."
            exit 1
          fi
          unset APPDIR APPIMAGE
          data="$RUNNER_TEMP/novadeck-sandbox-data"
          setsid xvfb-run -a "$HOME/.local/bin/novadeck" --user-data-dir="$data" > "$RUNNER_TEMP/novadeck-sandbox.log" 2>&1 &
          leader=$!
          trap 'kill -TERM -- "-$leader" 2> /dev/null || true; sleep 2; pkill -KILL -f -- "--user-data-dir=$data" 2> /dev/null || true' EXIT
          sleep 15
          if ! kill -0 "$leader" 2> /dev/null; then
            echo "::error::The installed AppImage exited before the sandbox check."
            cat "$RUNNER_TEMP/novadeck-sandbox.log"
            exit 1
          fi

          browser_ns=""
          browser_args=""
          browser_label=""
          renderers=()
          for pid in $(pgrep -f -- "--user-data-dir=$data"); do
            args="$(tr '\0' ' ' < "/proc/$pid/cmdline" 2> /dev/null)" || continue
            if [[ "$args" == *"--type=renderer"* ]]; then
              renderers+=("$pid")
            elif [[ "$args" != *"--type="* && "$args" == *".mount_"* ]]; then
              # The Electron binary inside the AppImage's mount, which AppRun starts.
              browser_ns="$(sudo readlink "/proc/$pid/ns/user")"
              browser_args="$args"
              browser_label="$(cat "/proc/$pid/attr/apparmor/current" 2> /dev/null || cat "/proc/$pid/attr/current" 2> /dev/null || true)"
              echo "browser $pid: $browser_ns ($browser_label) $args"
            fi
          done
          if [[ -z "$browser_ns" ]]; then
            echo "::error::Found no browser process of the installed AppImage."
            exit 1
          fi
          # The label the app reads to tell its own profile from none, in the form it expects
          # (sandbox.ts), so the footer offers no fix where the profile is in place.
          if [[ ! "$browser_label" =~ ^novadeck-appimage-$(id -u)\ \( ]]; then
            echo "::error::The installed AppImage runs as AppArmor label '$browser_label', not this user's novadeck-appimage profile."
            exit 1
          fi
          if [[ "$browser_args" == *"--no-sandbox"* ]]; then
            echo "::error::The installed AppImage runs with --no-sandbox, so the AppArmor profile did not allow user namespaces."
            exit 1
          fi
          if [[ "${#renderers[@]}" -eq 0 ]]; then
            echo "::error::The installed AppImage started no renderer to check."
            exit 1
          fi
          for pid in "${renderers[@]}"; do
            ns="$(sudo readlink "/proc/$pid/ns/user")"
            echo "renderer $pid: $ns"
            if [[ "$ns" == "$browser_ns" ]]; then
              echo "::error::A renderer of the installed AppImage shares the browser's user namespace, so Chromium's sandbox is not running."
              exit 1
            fi
          done

      - name: Smoke Test macOS Packages
        if: matrix.target == 'mac'
        timeout-minutes: 4
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          release=apps/desktop/release
          # The one app bundle at the top of a folder.
          bundle_in() {
            local bundles
            shopt -s nullglob
            bundles=("$2"/*.app)
            if [[ "${#bundles[@]}" -ne 1 || ! -d "${bundles[0]}" ]]; then
              echo "::error::Expected exactly one top-level app bundle in the $1." >&2
              exit 1
            fi
            printf '%s\n' "${bundles[0]}"
          }
          launch() {
            local what="$1" bundle="$2" executable_name executable pid
            executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")"
            executable="$bundle/Contents/MacOS/$executable_name"
            if [[ -z "$executable_name" || ! -x "$executable" || -d "$executable" ]]; then
              echo "::error::The executable of the app in the $what is missing or not executable."
              exit 1
            fi

            echo "Launching $executable"
            "$executable" &
            pid=$!
            sleep 10

            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" || true
              echo "::error::The app in the $what exited before the smoke-test interval."
              exit 1
            fi

            echo "The app in the $what stayed running for ten seconds; stopping it."
            kill "$pid" 2>/dev/null || true
            for _ in 1 2 3 4 5; do
              if ! kill -0 "$pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            if kill -0 "$pid" 2>/dev/null; then
              echo "Forcing smoke-test process cleanup after five seconds."
              kill -KILL "$pid" 2>/dev/null || true
            fi
            wait "$pid" || true
          }

          archive="$RUNNER_TEMP/novadeck-smoke"
          mkdir -p "$archive"
          echo "Extracting macOS package"
          ditto -x -k "$(find "$release" -maxdepth 1 -name '*.zip' -print -quit)" "$archive"
          bundle="$(bundle_in ZIP "$archive")"
          launch ZIP "$bundle"

          image="$RUNNER_TEMP/novadeck-smoke-image"
          hdiutil attach -nobrowse -readonly -mountpoint "$image" "$(find "$release" -maxdepth 1 -name '*.dmg' -print -quit)" > /dev/null
          if [[ ! -L "$image/Applications" ]]; then
            echo "::error::The disk image has no Applications shortcut to drag the app to."
            exit 1
          fi
          bundle="$(bundle_in "disk image" "$image")"
          launch "disk image" "$bundle"
          hdiutil detach -force "$image" > /dev/null

          # install.sh runs as released, against a local copy of the release's ZIP and its
          # checksum, and installs where it would for this account.
          serve="$RUNNER_TEMP/novadeck-release"
          mkdir -p "$serve"
          cp "$release"/novadeck-mac-universal.zip "$serve"
          (cd "$serve" && shasum -a 256 -- * > SHA256SUMS)
          sed "s|@REPOSITORY@|$REPOSITORY|g" scripts/install/install.sh > "$RUNNER_TEMP/install.sh"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$serve" > /dev/null 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for _ in {1..30}; do
            if curl -fs -o /dev/null http://127.0.0.1:8765/SHA256SUMS; then break; fi
            sleep 1
          done
          curl -fs -o /dev/null http://127.0.0.1:8765/SHA256SUMS

          NOVADECK_INSTALL_BASE_URL=http://127.0.0.1:8765 sh "$RUNNER_TEMP/install.sh"
          installed=""
          for folder in /Applications "$HOME/Applications"; do
            if [[ -d "$folder/novadeck.app" ]]; then installed="$folder/novadeck.app"; fi
          done
          if [[ -z "$installed" ]]; then
            echo "::error::install.sh left no novadeck.app in /Applications or ~/Applications."
            exit 1
          fi
          if xattr -p com.apple.quarantine "$installed" > /dev/null 2>&1; then
            echo "::error::install.sh left the app quarantined, so Gatekeeper would block an unsigned build."
            exit 1
          fi
          launch "app installed by install.sh" "$installed"

      - name: Smoke Test Windows Packages
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          function Test-Launch([string] $Path, [string] $What) {
            $process = Start-Process -FilePath $Path -PassThru
            Start-Sleep -Seconds 10
            $process.Refresh()

            if ($process.HasExited) {
              throw "The $What exited before the smoke-test interval with status $($process.ExitCode)."
            }

            Write-Host "The $What stayed running for ten seconds; stopping its process tree."
            $process.Kill($true)
            if (-not $process.WaitForExit(5000)) {
              throw "The $What did not stop after smoke-test cleanup."
            }
          }

          $setup = Get-ChildItem apps/desktop/release -Filter *-setup.exe | Select-Object -First 1
          if ($null -eq $setup) {
            throw "The installer was not found."
          }
          $install = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "The installer failed with status $($install.ExitCode)."
          }
          $folder = Join-Path $env:LOCALAPPDATA "Programs\novadeck"
          $app = Join-Path $folder "novadeck.exe"
          if (-not (Test-Path $app)) {
            throw "The installer put no novadeck.exe in $folder."
          }
          Test-Launch $app "installed application"

          $uninstaller = Get-ChildItem $folder -Filter "Uninstall *.exe" | Select-Object -First 1
          if ($null -eq $uninstaller) {
            throw "The installer put no uninstaller in $folder."
          }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "The uninstaller failed with status $($uninstall.ExitCode)."
          }
          # The uninstaller runs from a copy of itself, so it may still be removing files.
          for ($second = 0; $second -lt 30 -and (Test-Path $folder); $second++) {
            Start-Sleep -Seconds 1
          }
          if (Test-Path $folder) {
            throw "Uninstalling left $folder behind."
          }

          # The portable ZIP, extracted to a fresh folder; the installed copy has exited and
          # its folder is gone, so nothing holds the single-instance lock.
          $portable = Join-Path $env:RUNNER_TEMP "novadeck-smoke-portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf apps/desktop/release/novadeck-win-x64.zip -C $portable
          if ($LASTEXITCODE -ne 0) {
            throw "The portable ZIP did not extract."
          }
          $app = Join-Path $portable "novadeck.exe"
          if (-not (Test-Path $app)) {
            throw "The portable ZIP holds no novadeck.exe at its top."
          }
          if (Test-Path (Join-Path $portable "Uninstall *.exe")) {
            throw "The portable ZIP holds an uninstaller, which only the installer writes."
          }
          if (-not (Test-Path (Join-Path $portable "resources\app-update.yml"))) {
            throw "The portable ZIP holds no resources\app-update.yml."
          }
          Test-Launch $app "portable application"

      - name: Smoke Test Packaged Runner
        timeout-minutes: 5
        shell: bash
        working-directory: apps/desktop
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a pnpm run smoke
          else
            pnpm run smoke
          fi

      # Beside the packages, so the artifact keeps one flat folder for the release job.
      - name: Collect Engines
        shell: bash
        run: cp engines/whisper/dist/novadeck-whisper-*.tar.gz engines/murmur/dist/novadeck-murmur-*.tar.gz apps/desktop/release/

      - name: Upload Packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novadeck-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
