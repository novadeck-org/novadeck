# Diagnostic for #722, to come out once CI has shown it: a child's start on the bundled ConPTY,
# on a quiet Windows runner, in Vitest with the view project left out and in plain Node.
name: ConPTY Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    name: ConPTY Probe (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Plain Node
        working-directory: libraries/terminal
        run: node src/testing/conpty-probe.mjs

      - name: Vitest, Node Project Only
        working-directory: libraries/terminal
        run: pnpm exec vitest run --project node src/pty/native.test.ts
