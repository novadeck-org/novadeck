name: Nightly Report

# Each nightly run's end, on the issue that tracks its workflow (scripts/nightly): a failed
# night opens it, or adds to the one still open; the first green night closes it. Nobody
# otherwise sees a scheduled run fail, as nothing waits on it. A rerun of a night is
# reported too, by its attempt, except Known Flakes' own: GitHub starts no workflow from a
# rerun its token makes, so a night that a flake's rerun made green stays open until the
# next green night.
on:
  workflow_run:
    workflows: [E2E, Benchmark Timing]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    name: Report
    if: github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # To read the run's jobs.
      actions: read
      # To open, comment on and close the tracking issue.
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Node
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@26

      - name: Report Night
        run: node scripts/nightly/main.ts
