name: Nightly Report

# Each nightly run's end, on the issue that tracks its workflow (scripts/nightly): a failed
# night opens it, or adds to the one still open; the first green night closes it. Nobody
# otherwise sees a scheduled run fail, as nothing waits on it. A rerun of a night is
# reported too, by its attempt, except Known Flakes' own: GitHub starts no workflow from a
# rerun its token makes, so a night that a flake's rerun made green stays open until the
# next green night.
#
# A dispatch waits for the run it names to end and reports on it as a dry run: the summary
# says what it would do and shows the writeup, and no issue changes. With `report` it changes
# the issue for real: that is how E2E's run on the pinned harnesses is reported. Nightly
# Quality starts that run with its token, so the run's end starts no workflow here, and it
# dispatches this one beside it (a dispatch is the one event the token's runs can start). A run
# still going when the wait runs out is reported as a failed night, and this job fails, so a
# pinned night is never missed in silence.
on:
  workflow_run:
    workflows: [E2E, Benchmark Timing, Nightly Quality]
    types: [completed]
  workflow_dispatch:
    inputs:
      run:
        description: The id of a scheduled run to report on, dry
        required: true
      attempt:
        description: Its attempt
        default: "1"
      report:
        description: Change its issue for real, not as a dry run
        type: boolean
        default: false
      minutes:
        description: Minutes to wait for it to end, at most 310
        type: number
        default: 310

permissions:
  contents: read

jobs:
  report:
    name: Report
    # A night is a scheduled run, or E2E's run on the pinned harnesses, which Nightly Quality
    # dispatches with the Actions token (`actor` stays that bot when a person reruns it).
    # A run a person dispatched isn't reported: they are there to see it.
    if: >-
      github.event.workflow_run.event == 'schedule' ||
      (github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.name == 'E2E' &&
      github.event.workflow_run.actor.login == 'github-actions[bot]') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Waiting for a pinned E2E run takes as long as it waits for Macs.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 330 || 10 }}
    permissions:
      contents: read
      # To read the run's jobs.
      actions: read
      # To open, comment on and close the tracking issue.
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.attempt }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.report && '1' || '' }}
    steps:
      # Every minute, a failed read only waiting longer; past the deadline the night is lost.
      - name: Wait for Run
        id: wait
        if: github.event_name == 'workflow_dispatch'
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          deadline=$(( $(date +%s) + MINUTES * 60 ))
          until [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .status || true)" = completed ]; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "lost=it was still going after $MINUTES minutes of waiting for it." >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 60
          done

      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Node
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@26

      # A failed night's report carries a model's writeup of its logs; without the key, or if
      # the model fails, it goes without one (scripts/nightly/writeup.ts).
      - name: Report Night
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LOST: ${{ steps.wait.outputs.lost }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ env.RUN_ID }}
        run: node scripts/nightly/main.ts

      - name: Fail a Lost Night
        if: steps.wait.outputs.lost != ''
        env:
          LOST: ${{ steps.wait.outputs.lost }}
        run: |
          echo "::error::Run $RUN_ID couldn't be followed to its end: $LOST"
          exit 1
