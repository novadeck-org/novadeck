name: Nightly Quality

# Every check Quality runs on a pull request, run whole on main each night: format, lint,
# typecheck, the installer's shell check, both builds and the whole test suite on Linux,
# Windows and macOS. Quality runs only on pull requests, so this is what tests main after a
# merge, and what still runs a test a pull request is allowed to skip. Its last job starts
# E2E on main against the pinned harnesses, the versions pull requests test, as E2E's own
# nightly runs the latest ones to catch drift. A failed night of either opens or updates its
# issue (Nightly Report, scripts/nightly), and a release is promoted only once both passed
# at or after its commit.
#
# The jobs keep Quality's names and commands, so a night reads like a pull request's run. A
# pull request that changes this workflow or the setup action runs it too, so an edit proves
# itself before it merges; those runs start no E2E, and nothing counts them as a night.
on:
  schedule:
    # Early enough that the pinned E2E run it starts is done with the Macs before E2E's own
    # nightly (03:17), which would cancel it, as both share E2E's concurrency group on main:
    # Test (macOS) takes up to 40 minutes, E2E's macOS jobs about 30, and a queue for the
    # Mac runners can add as much to each.
    - cron: "23 0 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/quality-nightly.yml
      - .github/actions/setup/**

permissions:
  contents: read

# A night in progress finishes, and one started meanwhile waits for it; a pull request's run
# gives way to its next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout || (matrix.browser || matrix.shard) && 20 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            os: ubuntu-latest
            command: npm run format:check
          - name: Lint
            os: ubuntu-latest
            command: npm run lint
          - name: Typecheck
            os: ubuntu-latest
            command: npm run typecheck
          - name: Shell
            os: ubuntu-latest
            command: shellcheck -s sh scripts/install/install.sh
          # The parts and limits Quality gives them (see its comments for why). The browser
          # parts on Linux and Windows run the specs a second time as a Mac, so they have longer.
          - name: Test (Linux, 1/3)
            os: ubuntu-latest
            browser: true
            shard: 1
            timeout: 25
            step: 22
            command: npm run test:shard1
          - name: Test (Linux, 2/3)
            os: ubuntu-latest
            browser: true
            shard: 2
            timeout: 25
            step: 22
            command: npm run test:shard2
          - name: Test (Linux, 3/3)
            os: ubuntu-latest
            shard: 3
            command: npm run test:shard3
          - name: Test (macOS)
            os: macos-latest
            browser: true
            whole: true
            timeout: 40
            step: 37
            command: npm run test
          - name: Test (Windows, 1/3)
            os: windows-latest
            browser: true
            shard: 1
            timeout: 25
            step: 22
            command: npm run test:shard1
          - name: Test (Windows, 2/3)
            os: windows-latest
            browser: true
            shard: 2
            timeout: 25
            step: 22
            command: npm run test:shard2
          - name: Test (Windows, 3/3)
            os: windows-latest
            shard: 3
            command: npm run test:shard3
          - name: Build
            os: ubuntu-latest
            command: npm run build
          - name: Build (try)
            os: ubuntu-latest
            browser: true
            command: npm run build:try && npm run poster:try
    steps:
      # Two commits deep, as in Quality: on a pull request that edits this workflow, the
      # ratchet (scripts/ratchet) reads its budgets from the merge commit's first parent.
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # The relay's build is only restored: Warm Caches is the one writer of its key on main.
      - name: Set Up
        id: setup
        uses: ./.github/actions/setup
        with:
          rust: true
          browser: ${{ matrix.browser || false }}
          electron: ${{ matrix.shard == 2 || matrix.whole || false }}
          fish: ${{ matrix.shard == 1 }}

      # The relay's tests compile here, alone, before the tests run in parallel: compiled cold
      # beside them they took the CPU the native PTY tests wait on (Windows, 1/3).
      - name: Build Relay Tests
        if: matrix.shard == 1 || matrix.whole
        shell: bash
        working-directory: backend/relay
        run: cargo test --locked --no-run

      # Three minutes inside the job's own limit, so a hung test ends this step and the
      # failures' upload below still runs, rather than the whole job being cancelled.
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
        timeout-minutes: ${{ matrix.step || (matrix.browser || matrix.shard) && 17 || 7 }}
        env:
          NOVADECK_REQUIRE_FISH: ${{ steps.setup.outputs.fish == 'true' && '1' || '' }}
          # A re-run with debug logging records Playwright traces of failed UI specs.
          NOVADECK_UI_TRACE: ${{ runner.debug == '1' && '1' || '' }}
          # Each test file's line as it finishes, so the last line before a hang names the file.
          TURBO_LOG_ORDER: stream

      # Each test that passed only on a retry (Test retry's reporter), which Known Flakes'
      # Tally counts from every `retried-*` artifact in the repository.
      - name: Upload Retried Tests
        if: ${{ !cancelled() && (matrix.shard || matrix.whole) && hashFiles('test-results/retried/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retried-nightly-${{ runner.os }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}-${{ github.run_attempt }}
          path: test-results/retried/
          retention-days: 30

      # A failed UI spec leaves its screenshot, and its trace when one was recorded.
      - name: Upload UI Test Failures
        if: failure() && matrix.browser
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-failures-${{ runner.os }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: frontend/specs/.vitest/attachments/
          if-no-files-found: ignore
          retention-days: 14

  # E2E on main against the pinned harnesses, once the tests above are done with the Macs,
  # whatever they found: a night is both. Not from a pull request, whose run is no night.
  e2e:
    name: Start Pinned E2E
    needs: quality
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To start E2E.
      actions: write
    steps:
      - name: Start E2E
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run e2e.yml --ref main -f harness=pinned
