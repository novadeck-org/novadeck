name: Nightly Quality

# Every check Quality runs on a pull request, run whole on main each night: format, lint,
# typecheck, the installer's shell check, both builds and the whole test suite on Linux,
# Windows and macOS. Quality runs only on pull requests, so this is what tests main after a
# merge, and what still runs a test a pull request is allowed to skip. Its last job starts
# E2E on main against the pinned harnesses, the versions pull requests test, as E2E's own
# nightly runs the latest ones to catch drift. A failed night of either opens or updates its
# issue (Nightly Report, scripts/nightly), and a release is promoted only once both passed
# at or after its commit.
#
# The jobs keep Quality's names and commands, so a night reads like a pull request's run. A
# pull request that changes this workflow or the setup action runs it too, so an edit proves
# itself before it merges; those runs start no E2E, and nothing counts them as a night.
on:
  schedule:
    # Set for the delay GitHub measurably adds to this repository's scheduled runs, so the night
    # really starts at night, when no pull request waits for the Macs: about 00:30 to 02:00
    # UTC. Each day from 11-01 to 11-10 GitHub created E2E's 03:17 run at 10:10 to 11:32 and
    # Timing's 02:41 run at 09:14 to 10:25, 6.5 to 8.3 hours late. Started on time, it runs in
    # the early evening, beside pull requests: slower, as its macOS jobs wait for Macs, but not
    # wrong. A night is a run, never a date: the report, the promotion check and the
    # scoreboard count runs, whenever they start, and the scoreboard shows each night's
    # scheduled and actual start, so a change in the delay shows.
    - cron: "23 17 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/quality-nightly.yml
      - .github/actions/setup/**

permissions:
  contents: read

# A night in progress finishes, and one started meanwhile waits for it; a pull request's run
# gives way to its next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Ten minutes more than each row's tests (its `step`, or the step's own default), as
    # Quality's jobs: setup with a toolchain retry (180 s) and a cold relay build fits before
    # them, and a job cut mid-tests would upload no failure or retried record.
    timeout-minutes: ${{ matrix.timeout || (matrix.browser || matrix.shard) && 27 || 17 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            os: ubuntu-latest
            command: npm run format:check
          - name: Lint
            os: ubuntu-latest
            command: npm run lint
          - name: Typecheck
            os: ubuntu-latest
            command: npm run typecheck
          - name: Shell
            os: ubuntu-latest
            command: shellcheck -s sh scripts/install/install.sh
          # The parts and limits Quality gives them (see its comments for why). The browser
          # parts on Linux and Windows run the specs a second time as a Mac, so they have longer.
          - name: Test (Linux, 1/3)
            os: ubuntu-latest
            browser: true
            shard: 1
            timeout: 32
            step: 22
            command: npm run test:shard1
          - name: Test (Linux, 2/3)
            os: ubuntu-latest
            browser: true
            shard: 2
            timeout: 32
            step: 22
            command: npm run test:shard2
          - name: Test (Linux, 3/3)
            os: ubuntu-latest
            shard: 3
            command: npm run test:shard3
          - name: Test (macOS)
            os: macos-latest
            browser: true
            whole: true
            # The whole suite, on purpose, though Quality's macOS job runs only the system
            # packages since #849: this is what still runs the specs and every neutral package
            # on a real Mac, and any test a pull request stops running somewhere must still run
            # here. Don't narrow it to save Mac time; it is one job a night, nobody waiting.
            # As Quality's whole-suite row: on 11-10 the whole suite's macOS jobs took 25 to 39
            # minutes (a week before, 23 at the median), and under load 47m28, 49 and 50m33 on
            # 11-11 (16 on a quiet Mac); a night that runs out of time reports nothing about the
            # code. Nothing waits on this row.
            timeout: 75
            step: 65
            command: npm run test
          - name: Test (Windows, 1/3)
            os: windows-latest
            browser: true
            shard: 1
            timeout: 32
            step: 22
            command: npm run test:shard1
          - name: Test (Windows, 2/3)
            os: windows-latest
            browser: true
            shard: 2
            timeout: 32
            step: 22
            command: npm run test:shard2
          - name: Test (Windows, 3/3)
            os: windows-latest
            shard: 3
            command: npm run test:shard3
          - name: Build
            os: ubuntu-latest
            command: npm run build
          - name: Build (try)
            os: ubuntu-latest
            browser: true
            command: npm run build:try && npm run poster:try
    steps:
      # Two commits deep, as in Quality: on a pull request that edits this workflow, the
      # ratchet (scripts/ratchet) reads its budgets from the merge commit's first parent.
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # The relay's build is only restored: Warm Caches is the one writer of its key on main.
      - name: Set Up
        id: setup
        uses: ./.github/actions/setup
        with:
          rust: true
          browser: ${{ matrix.browser || false }}
          electron: ${{ matrix.shard == 2 || matrix.whole || false }}
          fish: ${{ matrix.shard == 1 }}

      # The relay's tests compile here, alone, before the tests run in parallel: compiled cold
      # beside them they took the CPU the native PTY tests wait on (Windows, 1/3).
      - name: Build Relay Tests
        if: matrix.shard == 1 || matrix.whole
        shell: bash
        working-directory: backend/relay
        run: cargo test --locked --no-run

      # Three minutes inside the job's own limit, so a hung test ends this step and the
      # failures' upload below still runs, rather than the whole job being cancelled.
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
        timeout-minutes: ${{ matrix.step || (matrix.browser || matrix.shard) && 17 || 7 }}
        env:
          NOVADECK_REQUIRE_FISH: ${{ steps.setup.outputs.fish == 'true' && '1' || '' }}
          # A re-run with debug logging records Playwright traces of failed UI specs.
          NOVADECK_UI_TRACE: ${{ runner.debug == '1' && '1' || '' }}
          # Each test file's line as it finishes, so the last line before a hang names the file.
          TURBO_LOG_ORDER: stream

      # Each test that passed only on a retry (Test retry's reporter), which Known Flakes'
      # Tally counts from every `retried-*` artifact in the repository.
      - name: Upload Retried Tests
        if: ${{ !cancelled() && (matrix.shard || matrix.whole) && hashFiles('test-results/retried/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retried-nightly-${{ runner.os }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}-${{ github.run_attempt }}
          path: test-results/retried/
          retention-days: 30

      # A failed UI spec leaves its screenshot, and its trace when one was recorded.
      - name: Upload UI Test Failures
        if: failure() && matrix.browser
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-failures-${{ runner.os }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: frontend/specs/.vitest/attachments/
          if-no-files-found: ignore
          retention-days: 14

  # E2E on main against the pinned harnesses, once the tests above are done with the Macs,
  # whatever they found: a night is both. Not from a pull request, whose run is no night.
  e2e:
    name: Start Pinned E2E
    needs: quality
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # To start E2E, and Nightly Report's wait for it.
      actions: write
      # To report a pinned night that couldn't be started or followed.
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The run this token starts starts no workflow when it ends, so Nightly Report isn't told
      # of it: it is dispatched beside it, to wait for the run and report it. Each way this can
      # go wrong is a lost night, reported below and failing this job, never a silent one.
      - name: Start E2E and Its Report
        id: start
        run: |
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if ! url=$(gh workflow run e2e.yml --ref main -f harness=pinned); then
            echo "lost=E2E couldn't be started on the pinned harnesses." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$url"
          id=$(grep -o 'runs/[0-9]*' <<< "$url" | cut -d/ -f2 || true)
          # An older gh prints no address: the newest such run since the dispatch is it.
          for _ in 1 2 3 4 5 6; do
            [ -n "$id" ] && break
            sleep 10
            id=$(gh api "repos/$GH_REPO/actions/workflows/e2e.yml/runs?event=workflow_dispatch&branch=main&created=%3E%3D$since" \
              --jq '[.workflow_runs[] | select(.actor.login == "github-actions[bot]")] | last | .id // empty' || true)
          done
          if [ -z "$id" ]; then
            echo "lost=the E2E run it started couldn't be found, so nothing waits for it." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=$id" >> "$GITHUB_OUTPUT"
          if ! gh workflow run nightly.yml --ref main -f run="$id" -f attempt=1 -f report=true; then
            echo "lost=Nightly Report couldn't be started to wait for it." >> "$GITHUB_OUTPUT"
          fi

      - name: Check Out Repository
        if: steps.start.outputs.lost != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Node
        if: steps.start.outputs.lost != ''
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@26

      # On the pinned night's own issue, at the E2E run when there is one, else this run.
      - name: Report Lost Night
        if: steps.start.outputs.lost != ''
        env:
          LOST: ${{ steps.start.outputs.lost }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.start.outputs.run || github.run_id }}
        run: |
          node scripts/nightly/main.ts
          echo "::error::The pinned E2E night couldn't be followed: $LOST"
          exit 1
