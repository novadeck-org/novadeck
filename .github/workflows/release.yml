name: Release

run-name: >-
  ${{ github.event_name == 'pull_request' && format('Package PR #{0}', github.event.pull_request.number) || 'Release latest main' }}

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [release]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.event.pull_request.number) || 'release-latest-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Prepare
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package: ${{ steps.plan.outputs.package || 'false' }}
      source_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Check Out Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Set Up Toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Capture Source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify Release Baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_tag="$tag"
              break
            fi
          done < <(git tag --merged HEAD --sort=-version:refname)

          if [[ -z "$latest_tag" ]]; then
            exit 0
          fi

          if ! is_draft="$(gh release view "$latest_tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            echo "::error::Release $latest_tag is incomplete. Delete any draft release and its tag, then rerun the latest release workflow."
            exit 1
          fi

          if [[ "$is_draft" == "true" ]]; then
            echo "::error::Release $latest_tag is still a draft. Clean up the draft and tag, then rerun the latest release workflow."
            exit 1
          fi

      - name: Plan Release
        id: plan
        run: |
          recommended_version="$(pnpm exec release-it --release-version --no-github.release)"
          if [[ -z "$recommended_version" ]]; then
            echo "package=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # TODO: Replace this command with version="$recommended_version" once Novadeck has an early working product.
          version="$(pnpm exec release-it patch --release-version --no-github.release)"
          {
            echo "package=true"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  package:
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
       (needs.prepare.result == 'success' && needs.prepare.outputs.package == 'true'))
    needs: prepare
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: linux
            files: |
              application/host/release/*.AppImage
              application/host/release/novadeck-whisper-linux-x64.tar.gz
          - name: macOS
            os: macos-latest
            target: mac
            files: |
              application/host/release/*.zip
              application/host/release/novadeck-whisper-darwin-universal.tar.gz
          - name: Windows
            os: windows-latest
            target: win
            files: |
              application/host/release/*.exe
              application/host/release/novadeck-whisper-win32-x64.tar.gz
    steps:
      - name: Wait for Quality Checks
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          for attempt in {1..10}; do
            run="$(gh api "repos/${REPOSITORY}/actions/workflows/quality.yml/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.head_sha == env.HEAD_SHA) |
                select(any(.pull_requests[]; .number == (env.PR_NUMBER | tonumber) and .base.sha == env.BASE_SHA))] |
                max_by(.run_number) // empty | {status, conclusion}')"

            if [[ -n "$run" ]]; then
              status="$(jq -r '.status' <<<"$run")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
              echo "Quality checks for ${HEAD_SHA}: ${status}${conclusion:+ (${conclusion})}"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" == "success" ]]; then
                  exit 0
                fi
                echo "::error::Quality checks completed with ${conclusion}."
                exit 1
              fi
            else
              echo "No matching Quality run found yet for PR #${PR_NUMBER} at ${HEAD_SHA}."
            fi

            if [[ "$attempt" -lt 10 ]]; then
              sleep 180
            fi
          done

          echo "::error::Quality checks did not complete within the wait window."
          exit 1

      - name: Check Out Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || needs.prepare.outputs.source_sha }}

      - name: Set Up Toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Set Package Version
        run: npm --prefix application/host pkg set "version=${{ needs.prepare.outputs.version || '0.0.0' }}"

      # Voice input's engine, whisper.cpp built for this platform (see application/whisper),
      # is compiled here, not by the Quality workflow's builds: it takes minutes, and its
      # archive is a release asset the app downloads, while the app ships only its manifest.
      - name: Install Vulkan Build Dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev glslc spirv-headers

      - name: Install Vulkan SDK (Windows)
        if: matrix.target == 'win'
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          vulkan_version: 1.4.363.0
          install_runtime: false
          cache: true

      - name: Restore Voice Engine
        id: engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: application/whisper/dist
          key: whisper-engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('application/whisper/scripts/**', 'application/whisper/patches/**', 'application/whisper/package.json') }}

      - name: Build Voice Engine
        if: steps.engine.outputs.cache-hit != 'true'
        run: pnpm --filter @novadeck/whisper build:engine

      # Unpacks the engine with the tar the runner uses on this platform and runs it, so a
      # missing library or backend module fails here rather than on a person's machine.
      - name: Check Voice Engine
        shell: bash
        run: |
          engine="$RUNNER_TEMP/voice-engine"
          mkdir -p "$engine"
          archive="$(ls application/whisper/dist/novadeck-whisper-*.tar.gz)"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "$SYSTEMROOT/System32/tar.exe" -xzf "$(cygpath -w "$archive")" -C "$(cygpath -w "$engine")"
            "$engine/whisper-server.exe" --help > /dev/null
          else
            tar -xzf "$archive" -C "$engine"
            "$engine/whisper-server" --help > /dev/null
          fi

      # The relay is built with the Rust its rust-toolchain.toml names; on macOS as one
      # binary for both architectures.
      - name: Package Application
        env:
          NOVADECK_RELAY_UNIVERSAL: "1"
        run: pnpm run package:${{ matrix.target }}

      - name: Smoke Test Linux Package
        if: matrix.target == 'linux'
        run: |
          artifact="$(realpath "$(find application/host/release -maxdepth 1 -name '*.AppImage' -print -quit)")"
          test -n "$artifact"
          chmod +x "$artifact"

          unset APPDIR APPIMAGE
          set +e
          timeout --kill-after=5s 10s xvfb-run -a "$artifact" --appimage-extract-and-run
          status=$?
          set -e

          if [[ "$status" -ne 124 ]]; then
            echo "::error::The AppImage exited before the smoke-test interval (status $status)."
            exit 1
          fi

      - name: Smoke Test macOS Package
        if: matrix.target == 'mac'
        timeout-minutes: 2
        run: |
          artifact="$(find application/host/release -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$artifact"
          smoke_directory="$RUNNER_TEMP/novadeck-smoke"
          mkdir -p "$smoke_directory"
          echo "Extracting macOS package"
          ditto -x -k "$artifact" "$smoke_directory"
          shopt -s nullglob
          bundles=("$smoke_directory"/*.app)
          if [[ "${#bundles[@]}" -ne 1 || ! -d "${bundles[0]}" ]]; then
            echo "::error::Expected exactly one top-level macOS app bundle."
            exit 1
          fi
          bundle="${bundles[0]}"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")"
          executable="$bundle/Contents/MacOS/$executable_name"
          if [[ -z "$executable_name" || ! -x "$executable" || -d "$executable" ]]; then
            echo "::error::The macOS bundle executable is missing or not executable."
            exit 1
          fi

          echo "Launching $executable"
          "$executable" &
          pid=$!
          sleep 10

          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid" || true
            echo "::error::The macOS application exited before the smoke-test interval."
            exit 1
          fi

          echo "The macOS application stayed running for ten seconds; stopping it."
          kill "$pid" 2>/dev/null || true
          for _ in 1 2 3 4 5; do
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "Forcing smoke-test process cleanup after five seconds."
            kill -KILL "$pid" 2>/dev/null || true
          fi
          wait "$pid" || true

      - name: Smoke Test Windows Package
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $artifact = Get-ChildItem application/host/release -Filter *.exe | Select-Object -First 1
          if ($null -eq $artifact) {
            throw "The portable executable was not found."
          }

          $process = Start-Process -FilePath $artifact.FullName -PassThru
          Start-Sleep -Seconds 10
          $process.Refresh()

          if ($process.HasExited) {
            throw "The portable executable exited before the smoke-test interval with status $($process.ExitCode)."
          }

          Write-Host "The Windows application stayed running for ten seconds; stopping its process tree."
          $process.Kill($true)
          if (-not $process.WaitForExit(5000)) {
            throw "The Windows application did not stop after smoke-test cleanup."
          }

      - name: Smoke Test Packaged Runner
        timeout-minutes: 5
        shell: bash
        working-directory: application/host
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a pnpm run smoke
          else
            pnpm run smoke
          fi

      # Beside the packages, so the artifact keeps one flat folder for the release job.
      - name: Collect Voice Engine
        shell: bash
        run: cp application/whisper/dist/novadeck-whisper-*.tar.gz application/host/release/

      - name: Upload Packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: novadeck-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Publish Dev Release
    if: github.event_name != 'pull_request' && needs.prepare.outputs.package == 'true'
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check Out Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set Up Toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Download Packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: novadeck-*
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish Dev Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec release-it "${{ needs.prepare.outputs.version }}" --ci
