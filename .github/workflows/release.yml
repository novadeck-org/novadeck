name: Release

run-name: Release latest main

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [release]

permissions:
  actions: read
  contents: read

concurrency:
  group: release-latest-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package: ${{ steps.plan.outputs.package || 'false' }}
      source_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Check Out Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Set Up Toolchain
        id: toolchain
        continue-on-error: true
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      # An immediate retry hit the same registry outage in the flake audit.
      - name: Wait Before Retrying Toolchain
        if: steps.toolchain.outcome == 'failure'
        shell: bash
        run: sleep 180

      - name: Set Up Toolchain Again
        if: steps.toolchain.outcome == 'failure'
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Capture Source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify Release Baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_tag="$tag"
              break
            fi
          done < <(git tag --merged HEAD --sort=-version:refname)

          if [[ -z "$latest_tag" ]]; then
            exit 0
          fi

          if ! is_draft="$(gh release view "$latest_tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            echo "::error::Release $latest_tag is incomplete. Delete any draft release and its tag, then rerun the latest release workflow."
            exit 1
          fi

          if [[ "$is_draft" == "true" ]]; then
            echo "::error::Release $latest_tag is still a draft. Clean up the draft and tag, then rerun the latest release workflow."
            exit 1
          fi

      - name: Plan Release
        id: plan
        run: |
          recommended_version="$(pnpm exec release-it --release-version --no-github.release)"
          if [[ -z "$recommended_version" ]]; then
            echo "package=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # TODO: Replace this command with version="$recommended_version" once Novadeck has an early working product.
          version="$(pnpm exec release-it patch --release-version --no-github.release)"
          {
            echo "package=true"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Package
    if: needs.prepare.outputs.package == 'true'
    needs: prepare
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    # Signing, which the package job does only for main.
    secrets: inherit

  release:
    name: Publish Dev Release
    # By the results it needs, not by skips inside Package (its Scope is skipped for main).
    # The repository variable PAUSE_DEV_RELEASES=true holds publishing, and with it the
    # update feed installs follow, while builds are still packaged and signed. Unset it and
    # rerun the latest Release to publish the newest build; installs then catch up to it.
    if: >-
      !cancelled() && needs.prepare.outputs.package == 'true' &&
      needs.prepare.result == 'success' && needs.package.result == 'success' &&
      vars.PAUSE_DEV_RELEASES != 'true'
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
      # Build provenance for every package, which `gh attestation verify` checks.
      attestations: write
      id-token: write
    steps:
      - name: Check Out Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set Up Toolchain
        id: toolchain
        continue-on-error: true
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      # An immediate retry hit the same registry outage in the flake audit.
      - name: Wait Before Retrying Toolchain
        if: steps.toolchain.outcome == 'failure'
        shell: bash
        run: sleep 180

      - name: Set Up Toolchain Again
        if: steps.toolchain.outcome == 'failure'
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Download Packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: novadeck-*
          path: release-assets
          merge-multiple: true

      # The installer for Linux and macOS, with this repository in it, so a moved repository needs no
      # edit. It is a release asset to be covered by the checksums, their signature and the
      # attestation like the packages it downloads.
      - name: Render Installer
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          sed "s|@REPOSITORY@|$REPOSITORY|g" scripts/install/install.sh > release-assets/install.sh
          if grep -q '@REPOSITORY@' release-assets/install.sh; then
            echo "::error::install.sh still holds its placeholder."
            exit 1
          fi
          shellcheck -s sh release-assets/install.sh

      # Everything install.sh, the installers and promoting a release look up by name.
      - name: Check Release Assets
        working-directory: release-assets
        run: |
          for name in \
            novadeck-mac-universal.dmg novadeck-mac-universal.zip \
            novadeck-win-x64-setup.exe novadeck-win-x64.zip \
            novadeck-linux-x86_64.AppImage \
            latest.yml latest-mac.yml latest-linux.yml install.sh; do
            if [[ ! -f "$name" ]]; then
              echo "::error::The release is missing $name."
              exit 1
            fi
          done

      - name: Generate Checksums
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS

      # A detached signature over the checksums, the way Linux users and packagers check a
      # download, once the release key is in the secrets. See docs/release-signing.md.
      - name: Sign Checksums
        working-directory: release-assets
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            if [[ -n "$GPG_PASSPHRASE" ]]; then
              echo "::error::GPG_PASSPHRASE is set, but signing the checksums needs GPG_PRIVATE_KEY too."
              exit 1
            fi
            echo "No release key; the checksums are published unsigned."
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --import <<<"$GPG_PRIVATE_KEY"
          # One key, so which one signs is never gpg's choice.
          keys="$(gpg --batch --with-colons --list-secret-keys | grep -c '^sec:' || true)"
          if [[ "$keys" != 1 ]]; then
            echo "::error::GPG_PRIVATE_KEY holds $keys secret keys; export only the release key, by its fingerprint."
            exit 1
          fi
          if ! gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS <<<"$GPG_PASSPHRASE"; then
            echo "::error::Signing the checksums failed. If the release key has expired, extend it and put a fresh export in GPG_PRIVATE_KEY; see docs/release-signing.md."
            exit 1
          fi
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS

      - name: Attest Packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish Dev Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec release-it "${{ needs.prepare.outputs.version }}" --ci

      # Notes people can read: a model rewrites the release's commits into short lines, and
      # the body gains the hidden block the app reads (scripts/release-notes). It never
      # holds a release: without the key, or when anything fails, the script writes no
      # notes and the generated changelog stays as it is.
      - name: Rewrite Release Notes
        continue-on-error: true
        timeout-minutes: 6
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "No OPENROUTER_API_KEY; the release keeps its generated changelog."
            exit 0
          fi
          node scripts/release-notes/main.ts release "$TAG" "$RUNNER_TEMP/notes.md"
          # A promotion while the model wrote may have given the release its own notes since,
          # before or after turning it stable.
          if [[ -s "$RUNNER_TEMP/notes.md" ]] &&
            [[ "$(gh release view "$TAG" --json isPrerelease,body \
              --jq '.isPrerelease and (.body | contains("\"kind\":\"promote\"") | not)')" == true ]]; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  # The visitor demo follows each release, prereleases included, until launch; then it moves
  # to Promote to Stable. Publishing with GITHUB_TOKEN starts no `release` workflow, so this
  # calls it here.
  try:
    name: Visitor Demo
    if: >-
      !cancelled() && needs.prepare.outputs.package == 'true' &&
      needs.release.result == 'success'
    needs: [prepare, release]
    uses: ./.github/workflows/try.yml
    with:
      tag: v${{ needs.prepare.outputs.version }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
