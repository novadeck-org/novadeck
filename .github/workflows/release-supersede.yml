name: Supersede Release

# Release runs one at a time in its concurrency group: a merge while one runs waits as the
# group's pending run, and a newer merge replaces that one. The run in progress still packaged
# a commit main had moved past, holding a macOS runner, the scarcest, for its build. On each push
# to main this cancels an older push's Release run while its Prepare or Package jobs still run
# (scripts/release-supersede), so the newest commit's run starts at once and is the one that
# publishes; its version counts from the newest published release, so the cancelled run's commits
# are in it. A run that publishes, or is about to, finishes: a cancel inside release-it could leave
# a tag without its release, which holds every release after it. A run by hand is never cancelled.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  supersede:
    name: Supersede
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To read Release's runs and jobs, and cancel the superseded ones.
      actions: write
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Node
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@26

      - name: Cancel Superseded Release Runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release-supersede/main.ts
