name: PR

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
  # A merge queue's group, once main requires one (architecture/ci-plan/merge-queue.md): inert
  # until then. Verify checks the group's pull request again, read from the group's branch.
  merge_group:

permissions:
  contents: read
  pull-requests: read

# A merge group is a group of its own (its ref), so one never cancels the one ahead of it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Toolchain
        id: toolchain
        continue-on-error: true
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      # An immediate retry hit the same registry outage in the flake audit.
      - name: Wait Before Retrying Toolchain
        if: steps.toolchain.outcome == 'failure'
        shell: bash
        run: sleep 180

      - name: Set Up Toolchain Again
        if: steps.toolchain.outcome == 'failure'
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Verify Pull Request
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          # A merge group's branch, `gh-readonly-queue/main/pr-<N>-<sha>`, names its pull request.
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pull-request/verify/main.ts

      - name: Lint Workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color
