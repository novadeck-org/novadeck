name: Quality

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.browser && 15 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            os: ubuntu-latest
            command: npm run format:check
          - name: Lint
            os: ubuntu-latest
            command: npm run lint
          - name: Typecheck
            os: ubuntu-latest
            command: npm run typecheck
          - name: Test (Linux)
            os: ubuntu-latest
            browser: true
            command: npm run test
          - name: Test (macOS)
            os: macos-latest
            browser: true
            command: npm run test
          - name: Test (Windows)
            os: windows-latest
            browser: true
            command: npm run test
          - name: Build
            os: ubuntu-latest
            command: npm run build
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Locate Test Browser
        if: matrix.browser
        id: playwright
        shell: bash
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
          echo "version=$(pnpm --filter @novadeck/ui exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Cache Test Browser
        if: matrix.browser
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Test Browser
        if: matrix.browser && steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @novadeck/ui exec playwright install --with-deps chromium

      # A cached browser still needs its system libraries on Linux.
      - name: Install Test Browser Dependencies
        if: matrix.browser && steps.browser-cache.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: pnpm --filter @novadeck/ui exec playwright install-deps chromium

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  test:
    name: Test
    needs: quality
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require All Quality Checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success
