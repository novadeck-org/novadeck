name: Quality

on:
  # Marking a draft ready runs it again: a draft runs no macOS job, and its gate fails until
  # the run of the ready pull request has (scripts/quality/plan, scripts/e2e/plan: `held`).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A merge queue's group, once main requires one (architecture/ci-plan/merge-queue.md): inert
  # until then.
  merge_group:

permissions:
  contents: read

# A pull request's newer push cancels its run in progress; a merge group is a group of its own
# (its ref, `gh-readonly-queue/main/pr-<N>-<sha>`), so one never cancels the one ahead of it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Which systems' tests a change needs, and which packages there (scripts/quality/plan, from
  # the package graph's plan, scripts/ci/plan): Windows and macOS test only the packages that
  # declare themselves `system` (scripts/workspace/platform.ts) and that the change affects,
  # dependents and `reads` included, as their runners are slower and, on macOS, scarce; a change
  # it can't narrow runs every test there. Linux runs every test for every change, and the
  # nightly run (quality-nightly.yml) runs every test on every system.
  plan:
    name: Plan Systems
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      windows: ${{ steps.plan.outputs.windows }}
      macos: ${{ steps.plan.outputs.macos }}
      held: ${{ steps.plan.outputs.held }}
      windows-rows: ${{ steps.plan.outputs.windows-rows }}
      windows-packages: ${{ steps.plan.outputs.windows-packages }}
      macos-rows: ${{ steps.plan.outputs.macos-rows }}
      packages: ${{ steps.plan.outputs.packages }}
      proof: ${{ steps.plan.outputs.proof }}
      proof-macos: ${{ steps.plan.outputs.proof-macos }}
      proof-windows-rows: ${{ steps.plan.outputs.proof-windows-rows }}
      proof-macos-rows: ${{ steps.plan.outputs.proof-macos-rows }}
    steps:
      # The whole history: turbo and git diff the pull request's base against its head, and
      # a shallow clone has neither.
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The toolchain, with its retry (.github/actions/setup).
      - name: Set Up
        uses: ./.github/actions/setup

      # A merge group's change is its own against the group's parent: main, or the entry ahead.
      - name: Plan Systems
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: node scripts/quality/plan/main.ts

  # The checks and Linux's tests, for every change.
  quality:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Ten minutes more than each row's tests (their step, below), as every Quality job: setup with
    # a toolchain retry (180 s) and a cold relay build fits before them, and a job cut mid-tests
    # would upload no failure or retried record.
    timeout-minutes: ${{ matrix.browser && matrix.shard && 32 || (matrix.browser || matrix.shard) && 27 || 17 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            os: ubuntu-latest
            command: npm run format:check
          # With atlas's anchors (in `lint`): a change that moves the code a flow or an area
          # points at fails here, not in the next person's brief.
          - name: Lint
            os: ubuntu-latest
            command: npm run lint
          - name: Typecheck
            os: ubuntu-latest
            command: npm run typecheck
          # The Linux installer; its behavior is tested with the rest of the repository.
          - name: Shell
            os: ubuntu-latest
            command: shellcheck -s sh scripts/install/install.sh
          # The tests in three parts on Linux and Windows, where they take longest (about 13
          # minutes whole): the repository's own and the libraries' and backend's with the
          # first half of the big frontend packages' (Vitest's `--shard`); the second half of
          # those with the small frontend packages and apps whole, which Vitest can't split, and
          # the host's; and the runner's, whose shell integration test alone takes over three
          # minutes. Windows's are in the `windows` job below, and macOS's in `macos`.
          # Linux's two browser parts have 25 minutes (22 for the tests): they also run the
          # specs whose chords differ on a Mac as a Mac (frontend/specs' `eachPlatform`), which
          # took 2/3 from a median of 9.3 minutes to about 12.8, and a slow runner had already
          # run 2/3 out of its 17 before that.
          - name: Test (Linux, 1/3)
            os: ubuntu-latest
            browser: true
            relay: true
            shard: 1
            command: npm run test:shard1
          - name: Test (Linux, 2/3)
            os: ubuntu-latest
            browser: true
            electron: true
            shard: 2
            command: npm run test:shard2
          - name: Test (Linux, 3/3)
            os: ubuntu-latest
            shard: 3
            command: npm run test:shard3
          - name: Build
            os: ubuntu-latest
            command: npm run build
          # The visitor build, which the Try workflow deploys from each release promoted to
          # stable. It also captures the posters the deploy makes, so a change that breaks that
          # fails here rather than at promotion.
          - name: Build (try)
            os: ubuntu-latest
            browser: true
            command: npm run build:try && npm run poster:try
    # The same steps for every job that checks or tests (`windows` and `macos` below), each
    # job's matrix saying what it needs: a browser, the relay's tests built, Electron.
    steps: &steps
      # Two commits deep: a pull request checks out its merge commit, whose first parent is
      # the base branch as it is now, which the ratchet (scripts/ratchet) reads its budgets against.
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # The toolchain with its retry, the relay's Rust and its build restored, and what the row
      # asks for: a browser (its system packages on Linux, from their own cache), Electron, fish
      # on Linux's first part (.github/actions/setup, as Nightly Quality). Every job restores the
      # relay's build; a key it lacks falls back to the newest entry of this platform. Only the
      # jobs that build the relay's tests save (below): a key is never replaced, and an entry
      # saved by a job that built no tests left the tests' job compiling them cold beside the
      # PTY tests.
      - name: Set Up
        id: setup
        uses: ./.github/actions/setup
        with:
          rust: true
          browser: ${{ matrix.browser || false }}
          electron: ${{ matrix.electron || false }}
          fish: ${{ matrix.shard == 1 }}

      # The relay's tests compile here, alone, before the tests run in parallel: compiled cold
      # beside them they took the CPU the native PTY tests wait on (Windows, 1/3).
      - name: Build Relay Tests
        id: relay-build
        if: matrix.relay
        shell: bash
        working-directory: backend/relay
        run: cargo test --locked --no-run

      # Three minutes inside the job's own limit, so a hung test ends this step and the
      # failures' upload below still runs, rather than the whole job being cancelled.
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
        timeout-minutes: ${{ runner.os == 'macOS' && (matrix.command == 'npm run test' && 57 || 30) || runner.os == 'Windows' && matrix.shard == 0 && 22 || matrix.browser && matrix.shard && 22 || (matrix.browser || matrix.shard) && 17 || 7 }}
        env:
          NOVADECK_REQUIRE_FISH: ${{ steps.setup.outputs.fish == 'true' && '1' || '' }}
          # A re-run with debug logging records Playwright traces of failed UI specs.
          NOVADECK_UI_TRACE: ${{ runner.debug == '1' && '1' || '' }}
          # Each test file's line as it finishes, not a package's whole log once it ends, so
          # the last line before a hang names the file that hung.
          TURBO_LOG_ORDER: stream

      # Saved even when a test failed, as the build itself is sound, but not when the run was
      # cancelled or the build failed: a partial target would sit under a key that is never
      # replaced. Skipped when the exact key was restored, for the same reason.
      - name: Save Rust Builds
        if: ${{ !cancelled() && steps.relay-build.outcome == 'success' && steps.setup.outputs.rust-cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/relay/target
          key: ${{ steps.setup.outputs.rust-key }}

      # A failed UI spec leaves its screenshot, and its trace when one was recorded.
      # Not from a proof row (`NOVADECK_TEST_CONTINUE`), whose job beside `Test (Windows)` would
      # take the same name.
      - name: Upload UI Test Failures
        if: failure() && matrix.browser && env.NOVADECK_TEST_CONTINUE != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-failures-${{ runner.os }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: frontend/specs/.vitest/attachments/
          if-no-files-found: ignore
          retention-days: 7

      # Every test that passed only on a retry (scripts/flakes/retry), which Known Flakes
      # counts: the run is green, so this is where its flakes show. Only when one did, and
      # not from a proof row (`NOVADECK_TEST_CONTINUE`), which tests what the test jobs do, and
      # whose flakes they count.
      - name: Upload Retried Tests
        if: ${{ !cancelled() && hashFiles('test-results/retried/**') != '' && env.NOVADECK_TEST_CONTINUE != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retried-${{ runner.os }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}-${{ github.run_attempt }}
          path: test-results/retried/
          retention-days: 30

  # Windows's tests, unless the plan says the change can't break them: the `system` packages it
  # affects in one job (`test:system`, as the root's `test` runs them), or, where it says `all`
  # (a run that follows no change, or a fact it couldn't read), every test, as Linux's in three
  # parts. Its rows are the plan's (scripts/quality/plan: `wholeWindows`, `systemWindows`); a
  # plan that failed, or left them out, runs every test, the rows written out here.
  windows:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.windows != 'false' }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The two browser parts run the specs' Mac pass too (frontend/specs' `eachPlatform`), about
    # three minutes on Windows 2/3's 11.5, so their tests have 22 minutes, as Linux's; the one job
    # of the system packages has as long. The job has ten minutes more than its tests.
    timeout-minutes: ${{ matrix.browser && 32 || 27 }}
    env:
      # The packages the plan says to test, which `test:system` reads.
      NOVADECK_TEST_PACKAGES: ${{ needs.plan.outputs.windows-packages }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.windows-rows || '[{"name":"Test (Windows, 1/3)","os":"windows-latest","browser":true,"relay":true,"shard":1,"command":"npm run test:shard1"},{"name":"Test (Windows, 2/3)","os":"windows-latest","browser":true,"electron":true,"shard":2,"command":"npm run test:shard2"},{"name":"Test (Windows, 3/3)","os":"windows-latest","shard":3,"command":"npm run test:shard3"}]') }}
    steps: *steps

  # macOS's tests, unless the plan says the change can't break them, and only once every Linux
  # job above has passed: a push that fails there, or is replaced while it runs, takes no macOS
  # runner. For a change the plan follows, only the packages that declare themselves `system`
  # and that it affects (`test:system`), one at a time: the `neutral` ones, the UI and the
  # browser packages, run the same on every system but for the browser's rendering, so they
  # run on Linux, the specs' Mac chords too (frontend/specs' `eachPlatform`), and on macOS in
  # the nightly run. Where the plan says `all`, failed, or left its rows out, every test (the
  # root's `test`), as before: it took 45m58s on #847, 33 minutes of them the specs. Its
  # packages ran 23 at once on a 3-core runner, where real-process tests failed (#784).
  macos:
    needs: [plan, quality]
    if: ${{ !cancelled() && needs.quality.result == 'success' && needs.plan.outputs.macos != 'false' }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The system packages a change affects, one at a time, took 4 to 13 minutes on the pull
    # requests and canaries after #862 (canary #865's 4m20s; canary #863's 9m32s; the proof
    # rows' widest list, 12 packages, 11m02s; #850's 12m53s); a loaded Mac takes 1.4 to 2 times
    # as long, and `testedFolders` can fall back to all 22 system packages: 30 for the tests.
    # Every test has 57 for the tests, as main gave it. The job has ten minutes more than its
    # tests, so setup with a toolchain retry (180 s) and a cold relay build still fits before
    # them: a job cancelled mid-tests uploads no failure or retried record, and its gate reads
    # "planned true, cancelled".
    timeout-minutes: ${{ matrix.command == 'npm run test' && 67 || 40 }}
    env:
      # The packages the plan says to test, which `test:system` reads.
      NOVADECK_TEST_PACKAGES: ${{ needs.plan.outputs.packages }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.macos-rows || '[{"name":"Test (macOS)","os":"macos-latest","browser":true,"relay":true,"electron":true,"shard":0,"command":"npm run test"}]') }}
    steps: *steps

  # Proof of the narrowed rows, for a pull request that changes how Windows's and macOS's tests
  # run (scripts/quality/plan: `proves`): its own run is planned `all`, so its `Test (Windows)`
  # and `test:system` would first run on someone else's pull request. Each row runs
  # `test:system` over the list the plan gives a real change at its head (`proofChanges`), every package's tests
  # though one fails (`NOVADECK_TEST_CONTINUE`), so one run shows each that fails. Canary #854
  # found a test that failed only there. Not required: the `Test` gate doesn't wait on them.
  proof-windows:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.proof == 'true' }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # As the Windows job's system packages: 22 for the tests, ten more for the job.
    timeout-minutes: 32
    env:
      NOVADECK_TEST_PACKAGES: ${{ toJSON(matrix.packages) }}
      NOVADECK_TEST_CONTINUE: "true"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.proof-windows-rows) }}
    steps: *steps

  # macOS's proof rows, once every Linux job has passed, as its tests; never on a draft, which
  # runs no macOS job (`proof-macos`): marking it ready runs them. They are outside the `Test`
  # gate, so a draft held only by them passes it, and says nothing of them.
  proof-macos:
    needs: [plan, quality]
    if: ${{ !cancelled() && needs.quality.result == 'success' && needs.plan.outputs.proof-macos == 'true' }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # As the macOS job's system packages: 30 for the tests, ten more for the job.
    timeout-minutes: 40
    env:
      NOVADECK_TEST_PACKAGES: ${{ toJSON(matrix.packages) }}
      NOVADECK_TEST_CONTINUE: "true"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.proof-macos-rows) }}
    steps: *steps

  # The pull request's app packaged for all three systems once every check passes, unless
  # it's a draft or its change can't affect the app (Package's Scope job decides). Not
  # part of the required checks, and never on a merge group, whose pull request packaged it.
  package:
    name: Package
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/package.yml

  # The one check main requires of the tests. It passes once every job the plan chose passed:
  # a system's tests the plan left out are skipped, and pass it; one it chose must have passed,
  # so a job skipped because Linux failed, or cancelled, fails it. Without a plan (it failed,
  # or left its outputs out) Windows and macOS run every test, and must both have passed. On a
  # draft whose change needs macOS it fails, saying so: GitHub makes a job's check only once
  # its `needs` are done, so for the 20 minutes and more after the draft is marked ready, a
  # draft's passing `Test` would be the only one on the commit, and would let it merge
  # without macOS. Known Flakes never reruns it (`aggregates` in its register).
  # Once the merge queue is on, its run guards the merge, and a draft's gate can pass again. `always()`,
  # not `!cancelled()`: a skipped required check counts as passed, so a cancelled run must
  # fail it.
  test:
    name: Test
    needs: [plan, quality, windows, macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require Every Planned Job
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          # A plan that failed or left its outputs out runs both: planned unless it said not.
          WINDOWS_PLANNED: ${{ needs.plan.outputs.windows != 'false' }}
          MACOS_RESULT: ${{ needs.macos.result }}
          MACOS_PLANNED: ${{ needs.plan.outputs.macos != 'false' }}
          MACOS_HELD: ${{ needs.plan.outputs.held }}
        run: |
          # Without a plan, Windows and macOS ran every test, and their results decide.
          test "$PLAN_RESULT" = success || echo "::warning title=Plan::Plan: $PLAN_RESULT, so Windows and macOS ran every test"
          test "$QUALITY_RESULT" = success || { echo "Checks and Linux tests: $QUALITY_RESULT"; exit 1; }
          if [ "$MACOS_HELD" = true ]; then
            echo "::error title=Draft::draft: macOS not run, mark ready to run it"
            echo "draft: macOS not run, mark ready to run it" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi
          for job in "Windows $WINDOWS_PLANNED $WINDOWS_RESULT" "macOS $MACOS_PLANNED $MACOS_RESULT"; do
            read -r name planned result <<< "$job"
            case "$planned $result" in
              "true success" | "false skipped") ;;
              *) echo "$name tests: planned $planned, $result"; exit 1 ;;
            esac
          done
