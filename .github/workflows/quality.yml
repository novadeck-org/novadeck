name: Quality

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout || matrix.browser && 20 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            os: ubuntu-latest
            command: npm run format:check
          - name: Lint
            os: ubuntu-latest
            command: npm run lint
          - name: Typecheck
            os: ubuntu-latest
            command: npm run typecheck
          # The Linux installer; its behavior is tested with the rest of the repository.
          - name: Shell
            os: ubuntu-latest
            command: shellcheck -s sh scripts/install/install.sh
          # The tests in two halves on Linux and Windows, where they take longest (about 13
          # minutes whole): the first runs the repository's own and the smaller packages',
          # and each half of the UI's and the runner's, which take most of the time (Vitest's
          # `--shard`). macOS runs them whole, as its concurrency, not its length, is the limit.
          - name: Test (Linux, 1/2)
            os: ubuntu-latest
            browser: true
            shard: 1
            command: npm run test:shard1
          - name: Test (Linux, 2/2)
            os: ubuntu-latest
            browser: true
            shard: 2
            command: npm run test:shard2
          # Whole, it took 18m 41s on #292 and ran past 20 minutes on #296.
          - name: Test (macOS)
            os: macos-latest
            browser: true
            timeout: 30
            command: npm run test
          - name: Test (Windows, 1/2)
            os: windows-latest
            browser: true
            shard: 1
            command: npm run test:shard1
          - name: Test (Windows, 2/2)
            os: windows-latest
            browser: true
            shard: 2
            command: npm run test:shard2
          - name: Build
            os: ubuntu-latest
            command: npm run build
          # The visitor build, which the Try workflow deploys from each release.
          # It also captures the posters the deploy makes, so a change that breaks that fails
          # here rather than at release.
          - name: Build (try)
            os: ubuntu-latest
            browser: true
            command: npm run build:try && npm run poster:try
    steps:
      # Two commits deep: a pull request checks out its merge commit, whose first parent is
      # the base branch as it is now, which the manager.ts ratchet reads its budgets against.
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set Up Toolchain
        id: toolchain
        continue-on-error: true
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      # An immediate retry hit the same registry outage in the flake audit.
      - name: Wait Before Retrying Toolchain
        if: steps.toolchain.outcome == 'failure'
        shell: bash
        run: sleep 180

      - name: Set Up Toolchain Again
        if: steps.toolchain.outcome == 'failure'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      # The Rust the relay's rust-toolchain.toml names, with rustfmt and clippy.
      - name: Set Up Rust
        shell: bash
        working-directory: application/relay
        run: rustup toolchain install

      - name: Cache Rust Builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            application/relay/target
          key: relay-${{ runner.os }}-${{ hashFiles('application/relay/Cargo.lock', 'application/relay/rust-toolchain.toml') }}

      - name: Locate Test Browser
        if: matrix.browser
        id: playwright
        shell: bash
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
          echo "version=$(pnpm --filter @novadeck/ui exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Cache Test Browser
        if: matrix.browser
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Test Browser
        if: matrix.browser && steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @novadeck/ui exec playwright install --with-deps chromium

      # A cached browser still needs its system libraries on Linux.
      - name: Install Test Browser Dependencies
        if: matrix.browser && steps.browser-cache.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: pnpm --filter @novadeck/ui exec playwright install-deps chromium

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
        env:
          # A re-run with debug logging records Playwright traces of failed UI specs.
          NOVADECK_UI_TRACE: ${{ runner.debug == '1' && '1' || '' }}

      # A failed UI spec leaves its screenshot, and its trace when one was recorded.
      - name: Upload UI Test Failures
        if: failure() && matrix.browser
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-failures-${{ runner.os }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: application/ui/.vitest/attachments/
          if-no-files-found: ignore
          retention-days: 7

  # The pull request's app packaged for all three systems once every check passes, unless
  # it's a draft or its change can't affect the app (Package's Scope job decides). Not
  # part of the required checks.
  package:
    name: Package
    needs: quality
    if: github.event.pull_request.draft == false
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/package.yml

  test:
    name: Test
    needs: quality
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require All Quality Checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success
