name: Promote to Stable

run-name: Promote ${{ inputs.version || 'the newest prerelease' }} to stable

# Every merge to main publishes a prerelease. Promoting one makes it the stable release
# that people who install the app, and apps checking for updates, get from now on. The
# binaries are not rebuilt: the release gains its notes, and its prerelease and latest
# flags change, all of which GitHub allows on an immutable release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to promote, such as 1.2.3. Empty promotes the newest published prerelease.
        required: false
        type: string

permissions: {}

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.choose.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Choose Release
        id: choose
        run: |
          set -euo pipefail

          if [[ -z "$VERSION" ]]; then
            tag="$(gh release list --limit 100 --json tagName,isDraft,isPrerelease \
              --jq '[.[] | select(.isPrerelease and (.isDraft | not))][0].tagName // empty')"
            if [[ -z "$tag" ]]; then
              echo "::error::There is no published prerelease to promote."
              exit 1
            fi
          elif [[ "$VERSION" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            tag="v${BASH_REMATCH[1]}"
          else
            echo "::error::'$VERSION' is not a version like 1.2.3."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify Release
        env:
          TAG: ${{ steps.choose.outputs.tag }}
        run: |
          set -euo pipefail

          if ! release="$(gh release view "$TAG" --json isDraft,isPrerelease,assets)"; then
            echo "::error::There is no release $TAG."
            exit 1
          fi
          if [[ "$(jq -r .isDraft <<<"$release")" == true ]]; then
            echo "::error::Release $TAG is still a draft; promote only published releases."
            exit 1
          fi
          if [[ "$(jq -r .isPrerelease <<<"$release")" != true ]]; then
            echo "::error::Release $TAG is not a prerelease, so there is nothing to promote."
            exit 1
          fi

          # What the installers, install.sh and installed apps fetch from the stable release.
          missing=""
          for name in \
            novadeck-mac-universal.dmg novadeck-mac-universal.zip \
            novadeck-win-x64-setup.exe novadeck-win-x64.zip \
            novadeck-linux-x86_64.AppImage \
            latest.yml latest-mac.yml latest-linux.yml install.sh SHA256SUMS; do
            if ! jq -e --arg name "$name" 'any(.assets[]; .name == $name)' <<<"$release" > /dev/null; then
              missing="$missing $name"
            fi
          done
          if [[ -n "$missing" ]]; then
            echo "::error::Release $TAG lacks:$missing"
            exit 1
          fi

          # A promotion never moves people to an older build. Without a stable release yet,
          # any version is newer.
          # GitHub's own idea of the latest release, which only a missing one (HTTP 404)
          # leaves empty; any other failure stops the promotion rather than skip this check.
          current=""
          if latest="$(gh api "repos/$GH_REPO/releases/latest" 2> "$RUNNER_TEMP/latest.err")"; then
            current="$(jq -r '.tag_name // empty' <<<"$latest")"
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/latest.err"; then
            echo "::error::Could not look up the current stable release: $(cat "$RUNNER_TEMP/latest.err")"
            exit 1
          fi
          if [[ -n "$current" && ! "$current" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The current stable release has an unexpected tag: $current"
            exit 1
          fi
          if [[ -n "$current" ]]; then
            newest="$(printf '%s\n%s\n' "$current" "$TAG" | sort -V | tail -n 1)"
            if [[ "$current" == "$TAG" || "$newest" != "$TAG" ]]; then
              echo "::error::Release $TAG is not newer than the current stable release $current."
              exit 1
            fi
            echo "Replacing stable release $current."
          else
            echo "There is no stable release yet."
          fi

  # The notes are written before the release turns stable, so no install that updates to it
  # finds them missing. They are a job of their own that may fail or run out of time without
  # holding the promotion, which waits for it but needs only the verification.
  notes:
    name: Write Release Notes
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Check Out Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Set Up Toolchain
        id: toolchain
        continue-on-error: true
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      # An immediate retry hit the same registry outage in the flake audit.
      - name: Wait Before Retrying Toolchain
        if: steps.toolchain.outcome == 'failure'
        shell: bash
        run: sleep 180

      - name: Set Up Toolchain Again
        if: steps.toolchain.outcome == 'failure'
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      # Highlights for the app's what's-new card, and every change since the last stable
      # release grouped by area (scripts/release-notes). Without the key, or when anything
      # fails, the script writes no notes, the release is promoted with the notes it has,
      # and the app shows no card for it.
      - name: Write Release Notes
        timeout-minutes: 12
        env:
          # The token only here, where the notes are read and written, not during setup.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_NOTES_PROMOTE_MODEL: ${{ vars.RELEASE_NOTES_PROMOTE_MODEL }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "No OPENROUTER_API_KEY; the release keeps the notes it has."
            exit 0
          fi
          node scripts/release-notes/main.ts promote "$TAG" "$RUNNER_TEMP/notes.md"
          if [[ -s "$RUNNER_TEMP/notes.md" ]]; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  promote:
    name: Promote
    needs: [verify, notes]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Promote Release
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --prerelease=false --latest
          echo "Release $TAG is now the stable release." | tee -a "$GITHUB_STEP_SUMMARY"
