name: Try

# The visitor build (`pnpm build:try`) on Cloudflare Pages, at try.novadeck.dev, beside the
# website: it deploys a release's source, so the demo shows a published version and never
# unreleased work. Until launch, Release calls this with each version it publishes,
# prereleases included; then it moves to Promote to Stable, so the demo shows what Download
# gives people. Run workflow deploys a tag by hand. Quality's "Build (try)" builds it on
# every pull request first. Without Cloudflare set up (README "Visitor build") it deploys
# nothing and says so.

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to deploy, such as v1.2.3.
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to deploy, such as v1.2.3 (1.2.3 works too). Any release since the demo's posters works, so this can also roll the demo back.
        required: true
        type: string

permissions:
  contents: read

# One deploy at a time: a later one waits for the one in flight rather than cutting it off
# midway.
concurrency:
  group: try-pages
  cancel-in-progress: false

jobs:
  # Deploys when both are set, skips when neither is, and fails when only one is, rather
  # than leave a half-made setup unnoticed.
  setup:
    name: Check Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check Cloudflare Is Set Up
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [[ -z "$CLOUDFLARE_API_TOKEN" && -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::notice::Cloudflare isn't set up, so the visitor demo isn't deployed."
          else
            echo "::error::Cloudflare is only partly set up; it needs both the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable."
            exit 1
          fi

  deploy:
    name: Deploy Visitor Demo
    needs: setup
    if: needs.setup.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Choose Tag
        id: choose
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$INPUT_TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "tag=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::'$INPUT_TAG' is not a release tag like v1.2.3."
            exit 1
          fi

      - name: Check Out Release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.choose.outputs.tag }}

      # pnpm is downloaded from the npm registry with a 30 s bound, which a slow runner
      # misses now and then (seen on Windows CI); a second try follows a failed first.
      - name: Set Up Toolchain
        id: toolchain
        continue-on-error: true
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Set Up Toolchain Again
        if: steps.toolchain.outcome == 'failure'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Build
        run: pnpm build:try

      # Where the tag's source puts the visitor build. A later layout is added ahead of this
      # one, so a tag from before it still deploys, as a rollback does; every step below reads
      # TRY_DIST, never the folder itself.
      - name: Locate Build
        run: |
          for dist in application/ui/dist-try; do
            if [[ -f "$dist/index.html" ]]; then
              echo "TRY_DIST=$dist" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::The visitor build left no index.html where a release puts it."
          exit 1

      # A release from before the visitor build was made public-ready builds a page that
      # search engines may index and that still plays the old tour, and one from before the
      # posters has nothing to make them with; neither is deployed.
      - name: Check Release Is Public-Ready
        env:
          TAG: ${{ steps.choose.outputs.tag }}
        run: |
          if ! grep -q '<meta name="robots" content="noindex"' "$TRY_DIST/index.html" ||
            [[ ! -f "$TRY_DIST/_headers" ]]; then
            echo "::error::$TAG predates the public visitor build; deploy a newer release."
            exit 1
          fi
          if ! grep -q '"poster:try"' package.json; then
            echo "::error::$TAG predates the demo's posters; deploy a newer release."
            exit 1
          fi

      # The website shows these screenshots of the demo while it loads, so they are made
      # from the build being deployed. They need Playwright's Chromium, installed like
      # Quality's test browser.
      - name: Locate Poster Browser
        id: playwright
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
          echo "version=$(pnpm --filter @novadeck/ui exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Cache Poster Browser
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Poster Browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @novadeck/ui exec playwright install --with-deps chromium

      # A cached browser still needs its system libraries.
      - name: Install Poster Browser Dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @novadeck/ui exec playwright install-deps chromium

      - name: Capture Posters
        run: pnpm poster:try

      - name: Check Posters
        run: |
          for scheme in light dark; do
            for width in 1280 2560; do
              if [[ ! -s "$TRY_DIST/poster-$scheme-$width.webp" ]]; then
                echo "::error::The $scheme poster at $width px wasn't made."
                exit 1
              fi
            done
          done

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ steps.choose.outputs.tag }}
        run: >-
          pnpm dlx wrangler@4.145.0 pages deploy "$TRY_DIST"
          --project-name=novadeck-try --branch=main
          --commit-hash="$(git rev-parse HEAD)" --commit-message="Novadeck $TAG"
