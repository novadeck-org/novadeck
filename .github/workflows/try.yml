name: Try

# The visitor build (`pnpm build:try`) on Cloudflare Pages, at try.novadeck.dev, beside the
# website: it deploys a release's source, so the demo shows a published version and never
# unreleased work. Until launch, Release calls this with each version it publishes,
# prereleases included; then it moves to Promote to Stable, so the demo shows what Download
# gives people. Run workflow deploys a tag by hand. Quality's "Build (try)" builds it on
# every pull request first. Without Cloudflare set up (README "Visitor build") it deploys
# nothing and says so.

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to deploy, such as v1.2.3.
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to deploy, such as v1.2.3 (1.2.3 works too). Any release works, so this can also roll the demo back.
        required: true
        type: string

permissions:
  contents: read

# One deploy at a time: a later one waits for the one in flight rather than cutting it off
# midway.
concurrency:
  group: try-pages
  cancel-in-progress: false

jobs:
  # Deploys when both are set, skips when neither is, and fails when only one is, rather
  # than leave a half-made setup unnoticed.
  setup:
    name: Check Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check Cloudflare Is Set Up
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [[ -z "$CLOUDFLARE_API_TOKEN" && -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::notice::Cloudflare isn't set up, so the visitor demo isn't deployed."
          else
            echo "::error::Cloudflare is only partly set up; it needs both the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable."
            exit 1
          fi

  deploy:
    name: Deploy Visitor Demo
    needs: setup
    if: needs.setup.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Choose Tag
        id: choose
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$INPUT_TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "tag=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::'$INPUT_TAG' is not a release tag like v1.2.3."
            exit 1
          fi

      - name: Check Out Release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.choose.outputs.tag }}

      # pnpm is downloaded from the npm registry with a 30 s bound, which a slow runner
      # misses now and then (seen on Windows CI); a second try follows a failed first.
      - name: Set Up Toolchain
        id: toolchain
        continue-on-error: true
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Set Up Toolchain Again
        if: steps.toolchain.outcome == 'failure'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Build
        run: pnpm build:try

      # A release from before the visitor build was made public-ready builds a page that
      # search engines may index and that still plays the old tour; it is never deployed.
      - name: Check Page Is Public-Ready
        env:
          TAG: ${{ steps.choose.outputs.tag }}
        run: |
          if ! grep -q '<meta name="robots" content="noindex"' application/ui/dist-try/index.html ||
            [[ ! -f application/ui/dist-try/_headers ]]; then
            echo "::error::$TAG predates the public visitor build; promote a newer release."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ steps.choose.outputs.tag }}
        run: >-
          pnpm dlx wrangler@4.145.0 pages deploy application/ui/dist-try
          --project-name=novadeck-try --branch=main
          --commit-hash="$(git rev-parse HEAD)" --commit-message="Novadeck $TAG"
