version: 2

# Monthly and grouped, so each ecosystem opens at most one or two PRs a month
# instead of one per dependency every week, each running the full CI and
# packaging matrix. Majors get their own group so they can't hold back the
# minor and patch bumps that automerge. Security updates ignore this schedule
# and still land promptly.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Europe/Warsaw"
    # The same three days pnpm's minimumReleaseAge (pnpm-workspace.yaml) holds a new version
    # back, so a version update never names one pnpm would refuse. Dependabot's security
    # updates skip this cooldown, but pnpm still refuses a fix younger than three days: add
    # its exact version to minimumReleaseAgeExclude there by hand, and remove it once it is old enough.
    cooldown:
      default-days: 3
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
    # Vite 8 needs electron-vite 6, still in beta: under Vite 8 the stable 5.x
    # bundles electron into the main process. plugin-react 6 needs Vite 8.
    # Lift both once electron-vite 6 is stable.
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # 2.3.0 memoizes GridItem without the drag position, so a window dragged in
      # Grid jumps cell to cell instead of following the pointer. Held at 2.2.4;
      # lift once a release fixes it.
      - dependency-name: "react-grid-layout"
        versions: [">=2.3.0"]
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:30"
      timezone: "Europe/Warsaw"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
    commit-message:
      prefix: "build"
      include: "scope"

  # The relay's crates, built into every package Novadeck ships.
  - package-ecosystem: "cargo"
    directory: "/backend/relay"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Europe/Warsaw"
    groups:
      crates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      crates-major:
        patterns:
          - "*"
        update-types:
          - "major"
    commit-message:
      prefix: "build"
      include: "scope"
