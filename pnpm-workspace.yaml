packages:
  - backend/*
  - contract/*
  - frontend/*
  - apps/*
  - engines/*
  - harnesses/*
  - libraries/*
  - tools/*

# Dependencies pinned once for every package: zod, whose schemas cross package lines (a
# library exports them and protocol composes them), so two versions can't meet; oRPC, whose
# client, contract and server halves must match across wire, protocol and the runner;
# Electron, which the host runs and wire's `/electron` and viewers' `/browser/host` are written
# against; and node-pty, a native module the terminal library takes as an optional peer and its
# consumers install.
catalog:
  "@orpc/client": 1.15.7
  "@orpc/contract": 1.15.7
  "@orpc/server": 1.15.7
  "@orpc/standard-server-peer": 1.15.7
  electron: ^45.1.0
  node-pty: 1.2.0-beta.14
  ws: 8.22.0
  zod: 4.6.7

publicHoistPattern:
  - electron

allowBuilds:
  electron-winstaller: true
  esbuild: true
  # Its binaries come in per-platform packages; the install script only checks for them.
  koffi: false
  msw: false
  node-pty: true
# A dependency version is accepted only once it has been published three days (the value is in
# minutes), so a hijacked release is usually pulled before it reaches us. Setting it also turns
# on pnpm's strict mode (`minimumReleaseAgeStrict`), which is the gate: an install fails rather
# than take a younger version, `pnpm install --frozen-lockfile` (CI's) checks every lockfile
# entry against it too (the current lockfile passes), and `pnpm dlx` in a workflow run from
# the repository reads it as well. Dependabot's cooldown matches, but its security updates skip
# that cooldown and pnpm still refuses a fix younger than three days. For such a fix, add its
# exact version below by hand (`name@version`; `pnpm audit --fix` offers to) and remove the line once
# it is old enough.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@types/node@26.6.2"
patchedDependencies:
  "@xterm/addon-unicode-graphemes@0.4.0": libraries/emulator/patches/@xterm__addon-unicode-graphemes@0.4.0.patch
  "@xterm/addon-webgl@0.19.0": libraries/emulator/patches/@xterm__addon-webgl@0.19.0.patch
  "@xterm/headless@6.0.0": libraries/emulator/patches/@xterm__headless@6.0.0.patch
  "@xterm/xterm@6.0.0": libraries/emulator/patches/@xterm__xterm@6.0.0.patch
  electron-updater@6.8.9: apps/desktop/patches/electron-updater@6.8.9.patch
  node-pty@1.2.0-beta.14: libraries/terminal/patches/node-pty@1.2.0-beta.14.patch
