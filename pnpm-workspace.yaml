packages:
  - application/*
  - backend/*
  - contract/*
  - frontend/*
  - apps/*
  - engines/*
  - harnesses/*
  - libraries/*
  - tools/*

# Dependencies pinned once for every package: zod, whose schemas cross package lines (a
# library exports them and protocol composes them), so two versions can't meet; oRPC, whose
# client, contract and server halves must match across wire, protocol and the runner;
# Electron, which the host runs and wire's `/electron` and viewers' `/browser/host` are written
# against; and node-pty, a native module the terminal library takes as an optional peer and its
# consumers install.
catalog:
  "@orpc/client": 1.15.7
  "@orpc/contract": 1.15.7
  "@orpc/server": 1.15.7
  "@orpc/standard-server-peer": 1.15.7
  electron: ^44.7.2
  node-pty: 1.2.0-beta.14
  ws: 8.22.0
  zod: 4.6.7

publicHoistPattern:
  - electron

allowBuilds:
  electron-winstaller: true
  esbuild: true
  msw: false
  node-pty: true
minimumReleaseAgeExclude:
  - "@types/node@26.6.2"
patchedDependencies:
  "@xterm/addon-unicode-graphemes@0.4.0": libraries/emulator/patches/@xterm__addon-unicode-graphemes@0.4.0.patch
  "@xterm/xterm@6.0.0": libraries/emulator/patches/@xterm__xterm@6.0.0.patch
  node-pty@1.2.0-beta.14: libraries/terminal/patches/node-pty@1.2.0-beta.14.patch
