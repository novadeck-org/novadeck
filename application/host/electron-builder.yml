appId: dev.mzpk.novadeck
productName: novadeck.
executableName: novadeck
asar: true
# PTY libraries and their spawn helpers must run from the real filesystem.
asarUnpack:
  - node_modules/node-pty/**
# node-pty ships N-API prebuilds for every target, which Electron loads unchanged.
# Rebuilding from source would shadow them without the bundled ConPTY files.
npmRebuild: false
directories:
  output: release
  # The app icon's sources; `build/` is ignored by git, so they live here.
  buildResources: resources
# The Deck mark, rendered from resources/icon.svg by scripts/render-icons.mjs; builder
# converts the 1024 px PNG for macOS and Windows.
icon: resources/icon.png
files:
  - out/**
  - package.json
extraResources:
  - from: ../ui/dist
    to: ui
  # The relay agents start for Novadeck's MCP server and hooks; see application/relay.
  - from: ../relay/dist
    to: relay
    filter:
      - novadeck-relay*
  # The manifest of the voice engine, which voice input downloads on install from this
  # release; the archive it names is a release asset, not part of the app. See
  # application/whisper.
  - from: ../whisper/dist/engine.json
    to: voice/engine.json
artifactName: novadeck-${version}-${os}-${arch}.${ext}
mac:
  # node-pty ships prebuilds for both architectures, and the relay is built universal; the
  # universal merge sees them unchanged in the x64 and arm64 copies, and each runs the
  # architecture of the host.
  x64ArchFiles: "{Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-*/*,Contents/Resources/relay/*}"
  # Electron resolves helpers from CFBundleName; builder strips the branding's trailing dot.
  extendInfo:
    CFBundleName: novadeck
    NSMicrophoneUsageDescription: Novadeck uses the microphone for voice input, transcribed on this computer.
  identity: null
  category: public.app-category.utilities
  target:
    - target: zip
      arch:
        - universal
win:
  target:
    - target: portable
      arch:
        - x64
linux:
  icon: resources/icons
  category: Utility
  maintainer: mzpkdev
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
