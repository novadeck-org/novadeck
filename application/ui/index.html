<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; connect-src __NOVADECK_CONNECT_SOURCES__; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>novadeck.</title>
    <!-- Sets the theme before the first paint; see docs/theming.md. -->
    <script src="./theme-boot.js"></script>
  </head>
  <body>
    <!-- SVG filters a theme may apply by id, since Chromium applies only filters in the
         page itself; see docs/theming.md. crt-barrel bulges an element like a tube's
         face, by the same pixels whatever its size, so a large element bends gently and a
         small one more: crt-barrel.png says how far each point samples from (red across,
         green down). -->
    <svg class="theme-filters" aria-hidden="true" width="0" height="0" style="position: absolute">
      <filter
        id="crt-barrel"
        x="0"
        y="0"
        width="1"
        height="1"
        primitiveUnits="userSpaceOnUse"
        color-interpolation-filters="sRGB"
      >
        <feImage href="./crt-barrel.png" preserveAspectRatio="none" result="map" />
        <feDisplacementMap
          in="SourceGraphic"
          in2="map"
          scale="40"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
