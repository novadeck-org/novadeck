<!doctype html>
<!-- The PDF viewer's frame (libraries/viewers/src/pdf.ts): loaded sandboxed, with an opaque
     origin, it runs only this script, which takes pdf.js, its worker and the viewer as text from
     the page that framed it, and a port to talk to it on. Its policy allows no network, no other
     script than these, and nothing from the app. The policy's hash is this script's text
     exactly: change the script and the hash with it (pdf.test.ts checks). It runs nothing unless
     its origin is opaque, as only a sandbox makes it. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'sha256-BR1AtVi1q/ARaKsqCI0ZF3PPW5lwj4tzEuJnlRlu9Rg=' blob: 'wasm-unsafe-eval'; worker-src blob:; style-src 'unsafe-inline'; img-src blob: data:; font-src blob: data:; base-uri 'none'; form-action 'none'"
    />
    <title>PDF</title>
  </head>
  <body>
    <script>
      // Only sandboxed, as the app frames it: a page that frames this one plainly would run its
      // script with this page's origin, the app's own.
      if (self.origin === "null") {
        // No page policy covers WebRTC: what pdf.js would never use is taken away first.
        Object.getOwnPropertyNames(self).forEach(function (name) {
          if (/^(webkit)?RTC/.test(name)) delete self[name]
        })
        addEventListener("message", function start(event) {
          var data = event.data
          var port = event.ports[0]
          if (event.source !== parent || !data || data.type !== "start" || !port) return
          removeEventListener("message", start)
          var url = function (text) {
            return URL.createObjectURL(new Blob([text], { type: "text/javascript" }))
          }
          var load = function (text) {
            return new Promise(function (done, fail) {
              var script = document.createElement("script")
              script.src = url(text)
              script.onload = done
              script.onerror = fail
              document.head.append(script)
            })
          }
          load(data.library)
            .then(function () {
              return load("self.pdfFrameViewer = " + data.viewer)
            })
            .then(function () {
              self.pdfFrameViewer({ pdfjs: self.pdfjsLib, worker: url(data.worker), port: port })
            })
        })
      }
    </script>
  </body>
</html>
