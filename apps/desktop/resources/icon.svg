<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The Nova mark on a Coolant tile, as the website draws it (NovaMark.astro in novadeck-website).
       Large sizes follow the macOS icon grid: an 824 px body inset 100 px, corner radius 185 px.
       16, 24 and 32 px swap to hand-placed pixel versions (the .sNN groups, at the size's own
       tile inset), so their strokes land on whole pixels. The media queries read the viewport,
       which scripts/render-icons.mjs sets to the size being rendered. -->
  <style>
    .s16, .s24, .s32 { display: none; }
    @media (max-width: 16px) { .big { display: none; } .s16 { display: inline; } }
    @media (min-width: 17px) and (max-width: 24px) { .big { display: none; } .s24 { display: inline; } }
    @media (min-width: 25px) and (max-width: 32px) { .big { display: none; } .s32 { display: inline; } }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g class="big">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="#1d1f23" filter="url(#lift)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="3"/>
    <g transform="translate(512 512) scale(8.2) translate(-32 -32)">
      <g fill="none" stroke="#e8e9ed" stroke-width="7">
        <polyline points="46,22 56,32 46,42"/>
        <polyline points="18,22 8,32 18,42"/>
        <polyline points="22,18 32,8 42,18"/>
        <polyline points="22,46 32,56 42,46"/>
      </g>
      <rect x="28" y="23" width="8" height="18" fill="#00e5d6"/>
    </g>
  </g>
